<style>

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

.hd,.pc{scroll-margin-top:12px}

.hin{--mw:40px;--ch:clamp(50px,calc((100cqw - 68px - var(--n)*6px) / var(--tw)),360px);position:relative;width:max-content;min-width:100%;padding:0 34px}
.hrul{position:absolute;left:0;right:0;top:0;height:var(--ch);border-bottom:1px solid var(--mut);pointer-events:none}

.hcol{flex:none;width:max(var(--mw),calc(var(--ch)*var(--w) + 4px));display:flex;flex-direction:column;align-items:center;padding:0 0 4px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer}

/* エディタフォーム */
.shed .ed label { display: block; font-size: 12px; color: var(--mut); margin: 8px 0 3px; }
.shed .ed input[type=text] {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
}
.shed .ed textarea {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  font-size: 14px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--fg);
  resize: none;
  overflow: hidden;
  field-sizing: content;
}
.shed .ed input[type=number] {
  width: 90px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
}
.shed .ed fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 14px 0 0; padding: 6px 12px 12px; }
.shed .ed fieldset fieldset { background: var(--zebra); }
.shed .ed legend { font-size: 12px; font-weight: 700; color: var(--main); padding: 0 6px; }
.shed .ed .hd { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.shed .ed .hd input, .ed .hd textarea { flex: 1; min-width: 0; }
.shed .ed select {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
}
.shed .ed .fr { margin-top: 6px; }
.shed .ed .it { display: grid; grid-template-columns: 1.6fr 1fr 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
.shed .ed .mini {
  padding: 5px 8px;
  font-size: 12px;
  border: 1px solid var(--line);

}
.shed .ed .ops { display: flex; gap: 4px; }
@media(max-width:560px) {
  .shed .ed .it { grid-template-columns: 1fr 1fr; }
  .shed .ed .it .ops { grid-column: 1/-1; }
  .shed .ed .it input:first-child { grid-column: 1/-1; }
}

/* 表の編集: 見出しごとのブロック */
.shed .ed .blk { border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; background: var(--card); overflow: hidden; }

.shed .ed .blkhd .tag { flex: none; font-size: 11px; font-weight: 700; color: var(--on); background: var(--main); border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.shed .ed .blkhd .tag.none { background: var(--mut); }
.shed .ed .blkhd input[type=text], .ed .blkhd textarea { flex: 1; min-width: 0; font-weight: 700; }
.shed .ed .blkhd .nohd { flex: 1; font-size: 12px; color: var(--mut); }
.shed .ed .blkdesc { padding: 8px 12px 0; }
.shed .ed .blkbody { padding: 4px 12px 2px; }
.shed .ed .itm { border-left: 3px solid var(--accent); background: var(--zebra); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-top: 8px; }
.shed .ed .itm .hd { margin-top: 0; }
.shed .ed .itm .hd .no { flex: none; font-size: 12px; color: var(--mut); min-width: 1.4em; text-align: center; }

.shed .ed .blkft { padding: 6px 12px 12px; }
.shed .ed .addblk { margin-top: 16px; }
@media(max-width:560px) { .ed .itm .two { grid-template-columns: 1fr; } }
/* 公開ページ(hue_wheel)と同じ見た目 */
.shed .hw,.shed .hw *{box-sizing:border-box}
.shed .hw{text-align:left;margin:0;padding:20px 14px 40px;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;isolation:isolate;position:relative}
.shed .hw{padding:0 0 10px;background:transparent}
.shed .hw main{max-width:620px;margin:0 auto}
.shed .hw textarea{width:100%;height:110px;margin-top:10px;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
/* ===== キャラ詳細の一番下: 性格・行動チェックシート ===== */
.shed .hw .cs-panel{margin-top:22px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}

.shed .hw .cs-ctl{display:flex;gap:6px}
.shed .hw .cs-ctl button{padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.shed .hw .cs-ctl .cs-key{padding:5px 10px;line-height:1}
.shed .hw .cs-ctl .cs-save{background:var(--main);color:var(--on);border-color:var(--main)}
.shed .hw .cs-ctl button[hidden]{display:none}
.shed .hw .cs-msg{min-height:1.2em;font-size:12px;color:var(--mut)}
.shed .hw .cs-s{margin-top:14px}
.shed .hw .cs-t{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg)}
.shed .hw .cs-t::after{content:"";flex:1;height:1px;background:var(--line)}
.shed .hw .cs-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin-top:6px}
@media(max-width:600px){.shed .hw .cs-cols{grid-template-columns:1fr}}
.shed .hw .cs-sub{margin:6px 0 2px;font-size:12px;color:var(--mut)}
.shed .hw .cs-r{padding:4px 0 6px}
.shed .hw .cs-q{font-size:11px;color:var(--mut)}
.shed .hw .cs-line{display:grid;grid-template-columns:4em 1fr 4em;align-items:center;gap:6px;font-size:12px}
.shed .hw .cs-l{text-align:right}
.shed .hw .cs-b{display:flex;gap:2px}
.shed .hw .cs-b i{flex:1;max-width:18px;aspect-ratio:1;border:1.5px solid var(--mut);border-radius:2px;background:var(--card);display:block}
.shed .hw .cs-panel.ed .cs-b i{cursor:pointer}
@media(hover:hover){.shed .hw .cs-panel.ed .cs-b i:hover{background:var(--hover)}}
.shed .hw .cs-b[data-v="1"] i:nth-child(1){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="2"] i:nth-child(2){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="3"] i:nth-child(3){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="4"] i:nth-child(4){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="5"] i:nth-child(5){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="6"] i:nth-child(6){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="7"] i:nth-child(7){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="8"] i:nth-child(8){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="9"] i:nth-child(9){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="10"] i:nth-child(10){background:var(--main);border-color:var(--main)}
.shed .hw .cs-b[data-v="11"] i:nth-child(11){background:var(--main);border-color:var(--main)}

/* ===== 複数シート(プルダウン切替・シート追加) ===== */
.shed .hw .csw{margin-top:22px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.shed .hw .csw .cs-panel{margin:0;padding:0;border:0;border-radius:0;background:none}

/* 表タイプのシート */

.shed .hw .cs-tbl th,.shed .hw .cs-tbl td{border:1px solid var(--line);padding:0;vertical-align:middle}

/* ===== デザイン統一(ボタン・プルダウン)/ タップ時の色は即時 ===== */
.shed .hw{-webkit-tap-highlight-color:transparent}
.shed .hw .cs-ctl button,.shed .hw .cs-picker button{box-sizing:border-box;min-height:32px;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font:inherit;font-size:13px;line-height:1.2;white-space:nowrap;cursor:pointer;transition:none}
.shed .hw .cs-ctl .cs-key{padding:5px 12px}
.shed .hw .cs-ctl .cs-save,.shed .hw .cs-picker .cs-padd{background:var(--main);color:var(--on);border-color:var(--main)}
.shed .hw .cs-ctl .cs-del{color:#c0392b;border-color:#c0392b}
.shed .hw .cs-ctl button[hidden],.shed .hw .cs-picker[hidden]{display:none}
.shed .hw .csw-sel,.shed .hw .cs-picker select{box-sizing:border-box;min-height:32px;max-width:100%;min-width:0;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font:inherit;font-size:13px}
.shed .hw .cs-picker{padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
.shed .hw .cs-ctl button:not(.cs-save):active,.shed .hw .cs-picker button:not(.cs-padd):active{background:var(--hover)}

/* 見出しは折り返さない(幅は文字数に合わせる)。JSON 内の \n はスマホ(600px以下)だけ改行 */
.shed .hw .cs-l,.shed .hw .cs-rr{white-space:pre-line;word-break:keep-all}
.shed .hw .cs-line{grid-template-columns:var(--wld,4em) 1fr var(--wrd,4em)}
.shed .hw br.sp{display:none}
.shed .hw .cs-tbl th{width:min(calc(var(--thd,6) * 1em + 1em + 16px),34%);white-space:pre-line;word-break:normal;overflow-wrap:anywhere}

/* 選択中(フォーカス時)の囲み枠を出さない */
.shed .hw .cs-panel :focus,.shed .hw .cs-panel :focus-visible,.shed .hw .csw :focus,.shed .hw .csw :focus-visible{outline:none}
.shed .hw .cs-panel .cs-tx:focus{box-shadow:inset 0 0 0 1px var(--line)}

/* スマホ: 編集中のボタン(鍵〜キャンセル)を1行に */
@media(max-width:600px){
  .shed .hw br.sp{display:inline}
  .shed .hw .cs-line{grid-template-columns:var(--wl,4em) 1fr var(--wr,4em)}
  .shed .hw .cs-tbl th{font-size:12px;padding:6px 4px;width:min(calc(var(--thw,6) * 1em + 1em + 8px),30%)}
  .shed .hw .cs-panel .cs-tx{padding:8px}
  .shed .hw .csw.ed .cs-ctl{flex:1 1 100%;flex-wrap:nowrap;justify-content:space-between;gap:4px}
  .shed .hw .csw.ed .cs-ctl button{flex:0 0 auto;min-height:30px;padding:4px 6px;font-size:11.5px}
  .shed .hw .csw.ed .cs-ctl .cs-key{padding:4px 8px}
}
@media(max-width:360px){
  .shed .hw .csw.ed .cs-ctl button{padding:4px 4px;font-size:10.5px}
}

/* ===== 見出し「チェックシート」を枠の外へ / プルダウンは枠内の見出し位置へ ===== */
.shed .hw .csw-title{margin-top:22px;font-size:14px;font-weight:700;color:var(--main);border-left:4px solid var(--accent);padding-left:8px}
.shed .hw .csw-title + .csw{margin-top:8px}
.shed .hw .csw-bar{flex:1 1 auto;min-width:0;margin:0}
.shed .hw .csw-bar[hidden]{display:none}
.shed .hw .csw-bar .csw-sel{max-width:100%}
.shed .hw .csw .cs-h{margin-bottom:6px}
.shed .hw .csw .cs-ctl{margin-left:auto}
@media(max-width:600px){
  .shed .hw .csw .csw-bar{flex:1 1 100%}
  .shed .hw .csw .cs-ctl,.shed .hw .csw.ed .cs-ctl{margin-left:0;justify-content:flex-start}
}
/* 表: 見出し列を狭く / 本文の文字サイズは見出しと同じ */
.shed .hw .cs-tbl th{width:min(calc(var(--thd,6) * 1em + 4px),34%);padding:8px 6px}
.shed .hw .cs-panel .cs-tx{font-size:13px}
@media(max-width:600px){
  .shed .hw .cs-tbl th{width:min(calc(var(--thw,6) * 1em + 2px),30%);padding:6px 3px;font-size:12px}
  .shed .hw .cs-panel .cs-tx{font-size:12px}
}
/* 表の編集中: 入力欄をマスいっぱいに(隙間・二重線をなくす) */
.shed .hw .cs-tbl td{height:1px}
.shed .hw .cs-tbl .cs-tx{min-height:2.4em}
.shed .hw .cs-tbl td{vertical-align:middle}
.shed .hw .cs-panel.ed .cs-tbl td{cursor:text}
.shed .hw .cs-panel.ed .cs-tbl td{background:var(--zebra)}
.shed .hw .cs-panel.ed .cs-tx,.shed .hw .cs-panel.ed .cs-tx:focus{background:transparent;box-shadow:none}
/* スマホでもボタンはPCと同じ大きさ・間隔(入りきらなければ折り返す) */
@media(max-width:600px){
  .shed .hw .csw.ed .cs-ctl,.shed .hw .csw .cs-ctl{flex-wrap:wrap;gap:6px;justify-content:flex-start}
  .shed .hw .csw.ed .cs-ctl button,.shed .hw .csw .cs-ctl button{flex:0 0 auto;min-height:32px;padding:5px 12px;font-size:13px}
  .shed .hw .csw.ed .cs-ctl .cs-key,.shed .hw .csw .cs-ctl .cs-key{padding:5px 12px}
}
/* スマホ: ボタンは必ず1行。画面幅に合わせて文字・余白・間隔を少しずつ縮める */
@media(max-width:600px){
  .shed .hw .csw.ed .cs-ctl,.shed .hw .csw .cs-ctl{flex-wrap:nowrap;gap:clamp(3px,1vw,6px);justify-content:flex-start}
  .shed .hw .csw.ed .cs-ctl button,.shed .hw .csw .cs-ctl button{flex:0 0 auto;min-height:32px;padding:5px clamp(5px,1.7vw,12px);font-size:clamp(10px,3.1vw,13px)}
  .shed .hw .csw.ed .cs-ctl .cs-key,.shed .hw .csw .cs-ctl .cs-key{padding:5px clamp(6px,2vw,12px)}
}
/* スマホ: 右端にぴったりくっつかないよう、ボタンをもう一回り小さく */
@media(max-width:600px){
  .shed .hw .csw .cs-ctl{max-width:100%;padding-right:4px;box-sizing:border-box;gap:clamp(3px,.8vw,5px)}
  .shed .hw .csw.ed .cs-ctl button,.shed .hw .csw .cs-ctl button{flex:0 1 auto;min-width:0;padding:5px clamp(4px,1.4vw,10px);font-size:clamp(9.5px,2.7vw,13px)}
  .shed .hw .csw.ed .cs-ctl .cs-key,.shed .hw .csw .cs-ctl .cs-key{padding:5px clamp(5px,1.7vw,10px)}
}

/* メッセージ欄が空のときは場所を取らない / セクション間を広く、先頭セクションの上の隙間はなくす */
.shed .hw .cs-msg:empty{display:none}
.shed .hw .cs-panel .cs-s{margin-top:28px}
.shed .hw .cs-panel .cs-s:first-child{margin-top:4px}
/* グループ間を広く / 項目名は中央揃え(先頭の「・」は表示しない) / 奇数マスの真ん中だけ薄いクリーム色 */
.shed .hw .cs-cols{gap:0 36px}
@media(max-width:600px){.shed .hw .cs-col+.cs-col{margin-top:22px}}
.shed .hw .cs-sub{margin:10px 0 4px}
.shed .hw .cs-q{text-align:center}
.shed .hw .cs-b[data-m="2"]:not([data-v="2"]) i:nth-child(2),
.shed .hw .cs-b[data-m="3"]:not([data-v="3"]) i:nth-child(3),
.shed .hw .cs-b[data-m="4"]:not([data-v="4"]) i:nth-child(4),
.shed .hw .cs-b[data-m="5"]:not([data-v="5"]) i:nth-child(5),
.shed .hw .cs-b[data-m="6"]:not([data-v="6"]) i:nth-child(6){background:var(--soft)}
/* 左右の見出し列を同じ幅にして、マスを項目名(中央揃え)の真下に中央寄せ */
.shed .hw .cs-line{grid-template-columns:max(var(--wld,4em),var(--wrd,4em)) 1fr max(var(--wld,4em),var(--wrd,4em))}
.shed .hw .cs-b{justify-content:center}
@media(max-width:600px){.shed .hw .cs-line{grid-template-columns:max(var(--wl,4em),var(--wr,4em)) 1fr max(var(--wl,4em),var(--wr,4em))}}
/* 項目名とマスの間を広く */
.shed .hw .cs-q{margin-bottom:6px}
/* カテゴリ名(セクション名)は太字 / グループ名は少し右へインデント */
.shed .hw .cs-t{font-weight:700}
.shed .hw .cs-sub{padding-left:10px}
/* プルダウンは全幅・1行目、ボタンは2行目で左詰め(PC・スマホ共通) */
.shed .hw .csw .cs-h{row-gap:8px}
.shed .hw .csw .csw-bar{flex:1 1 100%;margin:0}
.shed .hw .csw .csw-bar .csw-sel{width:100%;max-width:100%}
.shed .hw .csw .cs-ctl,.shed .hw .csw.ed .cs-ctl{margin-left:0;justify-content:flex-start;flex:0 1 auto}
/* スマホ: ボタン文字の左右に余白をもう少し(1行は維持) */
@media(max-width:600px){
  .shed .hw .csw.ed .cs-ctl button,.shed .hw .csw .cs-ctl button{padding:5px clamp(6px,2vw,11px);font-size:clamp(9.5px,2.6vw,13px)}
  .shed .hw .csw.ed .cs-ctl .cs-key,.shed .hw .csw .cs-ctl .cs-key{padding:5px clamp(7px,2.2vw,11px)}
}

/* スマホ: ボタン文字の左右余白をさらに広げる(1行のまま。余った幅は各ボタンに均等に配分) */
@media(max-width:600px){
  .shed .hw .csw{padding:10px}
  .shed .hw .csw .cs-ctl,.shed .hw .csw.ed .cs-ctl{gap:3px;padding-right:0}
  .shed .hw .csw.ed .cs-ctl{width:100%}
  .shed .hw .csw .cs-ctl button,.shed .hw .csw.ed .cs-ctl button{padding:5px clamp(8px,2.4vw,14px);font-size:clamp(9px,2.4vw,13px)}
  .shed .hw .csw .cs-ctl .cs-key,.shed .hw .csw.ed .cs-ctl .cs-key{padding:5px clamp(9px,2.6vw,14px)}
  .shed .hw .csw.ed .cs-ctl button{flex:1 0 auto}
}

/* ===== 説明文(✎編集中だけ表示) / 見出し(中央揃え・見出しごとに表を分離) / 縦並び / 年表 / 余白 ===== */
.shed .hw .cs-tx::placeholder,.shed .hw .cs-evt::placeholder{color:#b9ad9c;opacity:1}
.shed .hw .cs-desc,.shed .hw .cs-hdd,.shed .hw .cs-sd,.shed .hw .cs-tbl th .cs-d{display:none}
.shed .hw .cs-panel.ed .cs-desc,.shed .hw .cs-panel.ed .cs-hdd,.shed .hw .cs-panel.ed .cs-sd,.shed .hw .cs-panel.ed .cs-tbl th .cs-d{display:block}
.shed .hw .cs-desc{margin:6px 0 14px;font-size:12px;line-height:1.7;color:var(--mut)}
.shed .hw .cs-hdd{margin-top:4px;font-size:11px;line-height:1.6;color:var(--mut);text-align:center}
.shed .hw .cs-sd{margin-top:2px;font-size:11px;color:var(--mut);line-height:1.6}
.shed .hw .cs-tbl th .cs-d{margin-top:4px;font-size:10.5px;font-weight:400;color:var(--mut);line-height:1.4}
/* 見出し: 02のカテゴリ名と同じ大きさ(14px太字)で中央揃え。左右に線 */
.shed .hw .cs-hh{margin-bottom:12px}
.shed .hw .cs-hh .cs-t{justify-content:center;gap:14px}
.shed .hw .cs-hh .cs-t::before{content:"";flex:1;height:1px;background:var(--line)}
/* 見出しごとのまとまりの間隔 */
.shed .hw .cs-panel .cs-g{margin-top:36px}
.shed .hw .cs-panel .cs-g:first-child{margin-top:6px}
.shed .hw .cs-panel:not(.ed) .cs-desc + .cs-g{margin-top:6px}
.shed .hw .cs-panel.ed .cs-desc + .cs-g{margin-top:20px}
/* 表の余白 */
.shed .hw .cs-tbl{margin-top:0}
.shed .hw .cs-tbl th{padding:16px 10px;width:min(calc(var(--thd,6) * 1em + 24px),36%)}
.shed .hw .cs-tbl .cs-tx{padding:14px 16px;min-height:3.4em}
.shed .hw .csw{padding:20px 18px}
@media(max-width:600px){
  .shed .hw .csw{padding:14px 12px}
  .shed .hw .cs-tbl th{padding:12px 6px;width:min(calc(var(--thw,6) * 1em + 14px),32%)}
  .shed .hw .cs-tbl .cs-tx{padding:12px}
}
/* 縦並び(stack) */
.shed .hw .cs-sr{margin-top:20px}
.shed .hw .cs-hh + .cs-sr{margin-top:0}
.shed .hw .cs-sl{font-size:13px;font-weight:600;color:var(--fg);line-height:1.5;white-space:pre-line}
.shed .hw .cs-sr .cs-tx{margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-height:3.6em}
.shed .hw .cs-panel.ed .cs-sr .cs-tx,.shed .hw .cs-panel.ed .cs-sr .cs-tx:focus{background:var(--zebra)}
/* 年表(縦線タイムライン・出来事は自由に追加) */
.shed .hw .cs-tl{margin-top:16px;padding:0 2px}
.shed .hw .cs-ev{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:12px;padding-bottom:28px}
.shed .hw .cs-ev:last-child{padding-bottom:6px}
.shed .hw .cs-ev::before{content:"";position:absolute;left:7px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.shed .hw .cs-ev:last-child::before{display:none}
.shed .hw .cs-dot{display:block;width:16px;height:16px;margin-top:5px;border:3px solid var(--main);border-radius:50%;background:var(--card)}
.shed .hw .cs-evb{position:relative;min-width:0}
.shed .hw .cs-evt{display:block;width:100%;margin:0;padding:2px 0;border:0;border-radius:0;background:transparent;color:var(--main-deep);font:inherit;font-size:14px;font-weight:700;line-height:1.6;outline:none}
.shed .hw .cs-evb .cs-tx{margin-top:2px;padding:2px 0 0;min-height:1.8em;font-size:13px;line-height:1.7}
.shed .hw .cs-panel.ed .cs-evt{padding:4px 34px 4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--zebra)}
.shed .hw .cs-panel.ed .cs-evb .cs-tx,.shed .hw .cs-panel.ed .cs-evb .cs-tx:focus{margin-top:6px;padding:10px 12px;min-height:3.6em;border:1px solid var(--line);border-radius:6px;background:var(--zebra);box-shadow:none}
.shed .hw .cs-evdel,.shed .hw .cs-tladd{display:none}
.shed .hw .cs-panel.ed .cs-evdel{display:block;position:absolute;top:3px;right:4px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mut);font:inherit;font-size:18px;line-height:1;cursor:pointer}
.shed .hw .cs-panel.ed .cs-tladd{display:inline-block;margin:10px 0 0 28px;min-height:32px;padding:5px 14px;border:1px solid var(--main);border-radius:99px;background:var(--card);color:var(--main);font:inherit;font-size:13px;cursor:pointer}

/* グループ追加式(セクション → グループ → 項目) */
.shed .hw .cs-gp + .cs-gp{margin-top:30px;padding-top:24px;border-top:1px dashed var(--line)}
.shed .hw .cs-gph{position:relative}
.shed .hw .cs-gpl{display:block;width:100%;margin:0;padding:3px 8px;border:0;border-left:3px solid var(--accent);border-radius:0;background:transparent;color:var(--main);font:inherit;font-size:14px;font-weight:700;line-height:1.6;outline:none}
.shed .hw .cs-gpl::placeholder{color:#b9ad9c;opacity:1}
.shed .hw .cs-panel.ed .cs-gpl{padding:6px 34px 6px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;background:var(--zebra)}
.shed .hw .cs-gph + .cs-sr{margin-top:14px}
.shed .hw .cs-gph + .cs-tbl{margin-top:14px}
.shed .hw .cs-gpdel,.shed .hw .cs-gadd{display:none}
.shed .hw .cs-panel.ed .cs-gpdel{display:block;position:absolute;top:50%;right:5px;transform:translateY(-50%);width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mut);font:inherit;font-size:18px;line-height:1;cursor:pointer}
.shed .hw .cs-panel.ed .cs-gadd{display:inline-block;margin-top:24px;min-height:32px;padding:5px 14px;border:1px solid var(--main);border-radius:99px;background:var(--card);color:var(--main);font:inherit;font-size:13px;cursor:pointer}
/* 表の見出し列の幅: ブロックごとに --thd(PC)/--thw(スマホ) で計算。
   %を含む min() は固定レイアウトの表で無効になる(列が等分される)ので、絶対値だけで上限をかける */
.shed .hw .cs-tbl th{width:min(calc(var(--thd,6) * 1em + 48px),16em);padding-left:14px;padding-right:14px}
@media(max-width:600px){
  .shed .hw .cs-tbl th{width:min(calc(var(--thw,6) * 1em + 36px),12em);padding-left:10px;padding-right:10px}
}

/* チェックシート見出し行: タイトル + キャラ切り替え(プレビューでは見た目だけ) */
.shed .hw .csw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:22px}
.shed .hw .csw-head .csw-title{margin-top:0}
.shed .hw .csw-head + .csw{margin-top:8px}
.shed .hw .csw-head .psw .swb{display:block;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font-size:13px;white-space:nowrap}
.shed .hw .csw-head .psw .swb::after{content:" ▾"}
/* 中身が全部空のカテゴリは、編集中以外はカテゴリ名を出さない(行がなければまるごと非表示) */
.shed .hw .cs-panel:not(.ed) .cs-g.cs-empty .cs-hh{display:none}
.shed .hw .cs-panel:not(.ed) .cs-g.cs-empty.cs-norows{display:none}
/* 見た目(編集中でないとき)の隙間: 最初に見えているカテゴリの上は詰める / 入力済みの欄は、例(placeholder)の行数ぶんの高さを確保しない */
.shed .hw .cs-panel:not(.ed) .cs-g.cs-first{margin-top:6px}
.shed .hw .cs-panel:not(.ed) .cs-sr .cs-tx[style*="--pl"]:not(:placeholder-shown){min-height:3.6em}
.shed .hw .cs-panel:not(.ed) .cs-tbl .cs-tx[style*="--pl"]:not(:placeholder-shown){min-height:3.4em}
.shed .hw .cs-panel:not(.ed) .cs-evb .cs-tx[style*="--pl"]:not(:placeholder-shown){min-height:1.8em}

/* 表見出しの改行はPCでも効かせる / 例表示(placeholder)の改行ぶんの高さを確保 */
.shed .hw .cs-tbl th br.sp{display:inline}
.shed .hw .cs-panel .cs-tx[style*="--pl"]{min-height:calc(var(--pl) * 1.5em + 16px)}
.shed .hw .cs-panel .cs-tbl .cs-tx[style*="--pl"]{min-height:max(3.4em,calc(var(--pl) * 1.5em + 28px))}
.shed .hw .cs-panel .cs-sr .cs-tx[style*="--pl"]{min-height:calc(var(--pl) * 1.5em + 26px)}
.shed .hw .cs-panel .cs-evb .cs-tx[style*="--pl"]{min-height:calc(var(--pl) * 1.7em + 4px)}
.shed .hw .cs-panel.ed .cs-evb .cs-tx[style*="--pl"]{min-height:calc(var(--pl) * 1.7em + 22px)}
@media(max-width:600px){
  .shed .hw .cs-panel .cs-tbl .cs-tx[style*="--pl"]{min-height:max(3.4em,calc(var(--pl) * 1.5em + 24px))}
}

/* ===== チェックシートの編集画面 ===== */
.shed{--main:var(--ink);--main-deep:var(--ink);--accent:var(--ink);--on:var(--bg);--soft:color-mix(in srgb,var(--ink) 9%,var(--card));--soft-line:color-mix(in srgb,var(--ink) 20%,var(--card));--hover:color-mix(in srgb,var(--ink) 15%,var(--card));--zebra:color-mix(in srgb,var(--ink) 5%,var(--card));--img-bg:var(--zebra);--num:var(--ink);--danger:#d2455a;--bgop:.1}
.shed .sp{flex:1}
.shed [hidden]{display:none!important}
.shed .shfile{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:12px;margin-bottom:12px}
.shed .shfile>label{display:block;font-size:12px;font-weight:700;color:var(--fg);margin:0 0 6px 2px}
.shed .shrow{display:flex;gap:8px;align-items:stretch}
.shed #shSel{flex:1;min-width:0;height:44px;font-size:16px;font-weight:700}
.shed .shrl{width:44px;padding:0;font-size:18px}
.shed #shCur{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--line);font-size:13px;line-height:1.6}
.shed #shCur .dirty{display:block;color:var(--danger);font-weight:700}
.shed #shCur .hint{display:block;color:var(--mut);font-size:12px}
.shed .shnew{width:100%;margin-top:10px}
.shed .shtabs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.shed .shmsg{min-height:1.5em;font-size:13px;margin:0 0 10px;color:var(--mut)}
.shed .shmsg.err,.shed .msg.err{color:var(--danger)}
.shed .shcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--card)}
.shed .ed .mini{color:var(--fg)}
.shed .ed select{color:var(--fg)}
#dlg .shpicks{display:grid;gap:8px;margin:10px 0;max-height:55vh;overflow:auto}
#dlg .shpick{text-align:left}
/* 見た目は本体(キャラ詳細の .pc カード)に合わせる: 見出し文字は本文色、枠はカード1枚だけ */
.shed .hw .pc{margin-top:0}
.shed .hw .csw{margin:0;padding:0;border:0;border-radius:0;background:none}
.shed .hw .cs-evt,.shed .hw .cs-gpl,.shed .ed legend{color:var(--fg)}
/* シートの表: 背景色で塗らない(罫線だけ) / テンプレのプレビューでは空のカテゴリ名も出す */
.shed .hw .cs-tbl th,.shed .hw .cs-tbl td,.shed .hw .cs-panel.ed .cs-tbl td,.shed .hw .cs-panel.ed .cs-tbl .cs-tx,.shed .hw .cs-panel.ed .cs-tbl .cs-tx:focus{background:none}
.shed .hw.tpl .cs-panel:not(.ed) .cs-g.cs-empty .cs-hh{display:block}
.shed .hw.tpl .cs-panel:not(.ed) .cs-g.cs-empty.cs-norows{display:block}


/* キャラ詳細のチェックシート */
#cswh{margin-top:18px}
#cswh .hw .pc{margin-top:0}
#cswh .cs-picker .cs-missing{flex:1 1 100%}
</style>
</head>

<script>
const $=s=>document.querySelector(s),API_BASE='https://sosaku-api.cheeees0707.workers.dev',API=API_BASE+'/gh';
const S={token:localStorage.getItem('sm_sess')||'',repo:null,works:[],chars:[],gal:[],sha:{},workId:null,tab:'chars',q:'',pend:{},rev:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
/* 作成日: ts があればそれ、なければ id(接頭辞+時刻+乱数)から割り出す。最終更新日: 編集したときに up を記録(未編集なら作成日と同じ) */
const idTime=id=>{const n=parseInt(String(id||'').slice(1,-3),36);return n>1.4e12&&n<4.1e12?n:0};
const cTime=x=>x.ts||idTime(x.id);
const fD=t=>{const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
const isoD=t=>{if(!t)return'';const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const dateIn=(id,t)=>`<label for="${id}">作成日</label><input id="${id}" type="date" value="${isoD(t)}">`;
/* 作成日の入力欄 → 時刻。日付が変わっていなければ元の時刻のまま(変更なしなら何も起きない) */
const dateTs=(id,base)=>{const e=$('#'+id),v=e&&e.value;if(!v||isoD(base)==v)return base;const t=new Date(v+'T12:00:00').getTime();return isNaN(t)?base:t};
const dCre=x=>{const t=cTime(x);return t?`<span class="dt">作成 ${fD(t)}</span>`:''};
const dBoth=x=>{const t=cTime(x);return t?`<div class="dt w">作成日 ${fD(t)} ・ 最終更新日 ${fD(Math.max(x.up||0,t))}</div>`:''};
const hdr=()=>({Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json'});
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{let t='';new TextEncoder().encode(s).forEach(c=>t+=String.fromCharCode(c));return btoa(t)};
let tt;function status(m,e){const s=$('#toast');clearTimeout(tt);s.textContent=m;s.className=(m?'on ':'')+(e?'err':'');if(m&&!e&&!/中|待ち/.test(m))tt=setTimeout(()=>s.className='',2200)}

/* ---- オフライン用の保存(IndexedDB): データ(JSON)・画像・チェックシートを、読み込むたびに端末へ控えておく ---- */
const DB=(()=>{
  let p;
  const op=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('sm_cache',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('img')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }));
  const tx=(s,m,f)=>op().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(s,m),q=f(t.objectStore(s));
    t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error);
  }));
  return{
    get:(s,k)=>tx(s,'readonly',o=>o.get(k)),
    set:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),
    clear:s=>tx(s,'readwrite',o=>o.clear()),
    keys:s=>tx(s,'readonly',o=>o.getAllKeys())
  };
})();
let persisted=false;
const FK={'works.json':'works','characters.json':'chars','gallery.json':'gal'},FILES=Object.keys(FK);
const cl=x=>JSON.parse(JSON.stringify(x));
/* 最後にGitHubと一致した状態(base)を端末に控える。files を指定したファイルだけ更新する */
async function cacheData(files){
  try{
    const c=await DB.get('kv','data').catch(()=>null),b=c&&c.repo===S.repo?c:{repo:S.repo};
    (files||FILES).forEach(f=>{b[FK[f]]=cl(S[FK[f]])});
    b.t=Date.now();await DB.set('kv','data',b);
  }catch(e){}
  if(!persisted){persisted=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
}
/* オフライン中の未送信の変更を端末に控える */
let ltm;
function lsave(now){
  clearTimeout(ltm);
  const go=()=>{const fs=Object.keys(S.pend);if(!fs.length||!S.repo)return;const o={repo:S.repo,files:fs,t:Date.now()};fs.forEach(f=>{o[FK[f]]=cl(S[FK[f]])});DB.set('kv','local',o).catch(()=>{})};
  if(now)go();else ltm=setTimeout(go,500);
}
addEventListener('pagehide',()=>lsave(1));
document.addEventListener('visibilitychange',()=>{if(document.hidden)lsave(1)});
function paintOff(){const ob=$('#offb');if(!ob)return;ob.hidden=!(S.off&&S.repo);ob.textContent=Object.keys(S.pend).length?(S.cfHold?'競合の確認待ち(未送信の変更あり)':'オフライン(未送信の変更あり)'):'オフライン'}
/* 3-way マージ(base=最後に同期した状態 / l=この端末 / r=GitHub上の最新)。
   同じ項目の同じ欄を両方で変えた(または片方が削除・片方が変更した)場合は競合として st.cf に集め、
   ポップアップでどちらを残すか選んでもらう(選択結果は st.dec[キー]='l'|'r')。 */
function deq(a,b){if(a===b)return true;if(!a||!b||typeof a!='object'||typeof b!='object'||Array.isArray(a)!=Array.isArray(b))return false;const ka=Object.keys(a),kb=Object.keys(b);return ka.length==kb.length&&ka.every(k=>deq(a[k],b[k]))}
const isObj=x=>!!x&&typeof x=='object'&&!Array.isArray(x);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null);
const FLAB={'works.json':'作品','characters.json':'キャラクター','gallery.json':'ギャラリー'};
const KLAB={title:'タイトル',name:'名前',body:'本文',ruby:'ふりがな',memo:'メモ',tags:'タグ',color:'色',icon:'アイコン',info:'情報',voice:'セリフ',stands:'立ち絵',ts:'作成日',o:'並び順',p:'フォルダ',workId:'作品',chars:'キャラ',url:'動画URL',imgs:'画像',type:'種類',notes:'設定',memos:'メモ',covers:'カバー'};
/* 競合を1件記録する。選択済みなら true(GitHub側を採用)/false(この端末を採用)を返す。未選択のあいだは仮に端末側 */
function cf(st,key,item,field,lv,rv){
  st.c++;
  const d=st.dec?st.dec[key]:undefined;
  if(d===undefined){st.cf.push({key,item,field,lv,rv});return false}
  return d=='r';
}
function mg(b,l,r,st,p,t,fl){
  if(deq(l,r))return r;
  if(deq(b,l))return r;
  if(deq(b,r))return l;
  if(idArr(l)&&idArr(r)&&(b==null||idArr(b)))return mgArr(b||[],l,r,st,p,t);
  if(isObj(l)&&isObj(r)){
    const bb=isObj(b)?b:{},o={};
    for(const k of new Set([...Object.keys(bb),...Object.keys(l),...Object.keys(r)])){
      let v;
      if(k=='up'&&typeof l[k]=='number'&&typeof r[k]=='number')v=Math.max(l[k],r[k]); /* 最終更新日は、新しい方にするだけ(選んでもらう必要はない) */
      else v=mg(bb[k],l[k],r[k],st,p+'/'+k,t,(fl?fl+' › ':'')+(KLAB[k]||k));
      if(v!==undefined)o[k]=v;
    }
    return o;
  }
  return cf(st,p,t,fl,l,r)?r:l;
}
function mgArr(b,l,r,st,p,t){
  const bm=new Map(b.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[];
  const tt=x=>(t?t+' › ':'')+(x.title||x.name||'(無題)');
  for(const x of r){
    const id=x.id;
    if(lm.has(id))out.push(mg(bm.get(id)||{},lm.get(id),x,st,p+'/'+id,tt(lm.get(id)),''));
    else if(bm.has(id)){ /* この端末で削除。GitHub側で変更されていたら、どちらにするか選ぶ */
      if(!deq(bm.get(id),x)&&cf(st,p+'/'+id,tt(x),'この端末では削除/GitHub側では変更','(削除したまま)','(GitHub側で変更された内容を残す)'))out.push(x);
    }
    else out.push(x); /* GitHub側で追加された */
  }
  for(const x of l){
    if(rm.has(x.id))continue;
    if(bm.has(x.id)){ /* GitHub側で削除。この端末で変更されていたら、どちらにするか選ぶ */
      if(!deq(bm.get(x.id),x)&&!cf(st,p+'/'+x.id,tt(x),'GitHub側では削除/この端末では変更','(この端末で変更した内容を残す)','(削除する)'))out.push(x);
    }
    else out.push(x); /* この端末で追加 */
  }
  return out;
}
/* 競合の選択ポップアップ(別のダイアログ。ほかの画面の戻る操作には触れない)。list=[{key,file,item,field,lv,rv}] → {key:'l'|'r'} / あとで=null */
const cfv=(v,fl)=>{
  if(v===undefined)return'(なし)';
  let t=typeof v=='string'?(v||'(空)'):typeof v=='number'&&fl=='作成日'?fD(v):JSON.stringify(v);
  return t.length>400?t.slice(0,400)+'…':t;
};
let cfQ=Promise.resolve();
const askConflicts=list=>cfQ=cfQ.then(()=>cfShow(list),()=>cfShow(list));
function cfShow(list){
  return new Promise(res=>{
    const d=$('#cfdlg');let fin=false;
    const sel=i=>{const x=d.querySelector(`input[name="cf${i}"]:checked`);return x?x.value:'l'};
    d.innerHTML=`<h3 style="margin:0">競合しています(${list.length}件)</h3><p class="mut">同じ欄を、この端末とGitHub側の両方で変えています。残す方を選んでください。</p>
    <div class="row" style="margin-top:8px"><button class="btn sub" id="cfl" type="button">すべてこの端末</button><button class="btn sub" id="cfr" type="button">すべてGitHub側</button></div>
    ${list.map((c,i)=>`<div class="cf"><div class="cft">${esc(c.file)} › ${esc(c.item)}</div>${c.field?`<div class="mut">${esc(c.field)}</div>`:''}
      <label class="cfo"><input type="radio" name="cf${i}" value="l" checked><span><b>この端末</b><pre>${esc(cfv(c.lv,c.field))}</pre></span></label>
      <label class="cfo"><input type="radio" name="cf${i}" value="r"><span><b>GitHub側</b><pre>${esc(cfv(c.rv,c.field))}</pre></span></label></div>`).join('')}
    <div class="row cfbar"><button class="btn sub" id="cfx" type="button">あとで</button><span class="sp"></span><button class="btn" id="cfok" type="button">この内容で保存</button></div>`;
    const done=v=>{if(fin)return;fin=true;if(d.open)d.close();res(v)};
    d.querySelector('#cfok').onclick=()=>{const o={};list.forEach((c,i)=>{o[c.key]=sel(i)});done(o)};
    d.querySelector('#cfl').onclick=()=>d.querySelectorAll('input[value=l]').forEach(x=>x.checked=true);
    d.querySelector('#cfr').onclick=()=>d.querySelectorAll('input[value=r]').forEach(x=>x.checked=true);
    d.querySelector('#cfx').onclick=()=>done(null);
    d.addEventListener('close',()=>done(null),{once:true}); /* Esc・戻るで閉じた場合も「あとで」 */
    d.showModal();d.scrollTop=0;
  });
}
/* base・端末・GitHub側を合わせる。競合があれば選んでもらう。あとで(中止)なら null、決まれば {m:合わせた結果, c:競合の件数} */
async function mergeAsk(f,base,loc,rem){
  const run=dec=>{const st={c:0,cf:[],dec};return{m:mg(base,loc,rem,st,f,'',''),st}};
  let a=run(null);
  if(!a.st.cf.length)return{m:a.m,c:0};
  const dec=await askConflicts(a.st.cf.map(c=>({...c,file:FLAB[f]||f})));
  if(!dec)return null;
  a=run(dec);
  return{m:a.m,c:a.st.c};
}
const tmo=()=>typeof AbortSignal!='undefined'&&AbortSignal.timeout?AbortSignal.timeout(15000):undefined;
async function findRepo(){
  const r=await fetch(API_BASE+'/me',{headers:hdr(),signal:tmo()});
  if(r.status==401){const e=new Error('ログインの期限が切れました。もう一度ログインしてください');e.auth=true;throw e}
  if(!r.ok)throw new Error('接続できません');
  return (await r.json()).repo;
}
async function load(f){
  const r=await fetch(`${API}/repos/${S.repo}/contents/${f}`,{headers:hdr(),signal:tmo()});
  if(r.status==404){S.sha[f]=null;return[]}
  if(!r.ok)throw new Error(f+' を読み込めません');
  const j=await r.json();S.sha[f]=j.sha;
  let txt=j.content?b64d(j.content):'';
  if(!txt&&j.size>0){ /* 1MBを超えるファイルは content が空で返るので、rawで取り直す */
    const rr=await fetch(`${API}/repos/${S.repo}/contents/${f}`,{headers:{...hdr(),Accept:'application/vnd.github.raw+json'}});
    if(!rr.ok)throw new Error(f+' を読み込めません');
    txt=await rr.text();
  }
  return JSON.parse(txt||'[]');
}
async function put(f,data,retry){
  const body={message:'update '+f,content:b64e(JSON.stringify(data,null,1))};
  if(S.sha[f])body.sha=S.sha[f];
  const r=await fetch(`${API}/repos/${S.repo}/contents/${f}`,{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
  if((r.status==409||r.status==422)&&!retry){
    /* 保存の前に、ほかの端末がGitHubを更新していた:最新を取り込んで合わせ、同じ欄の競合は選んでもらう */
    let nd=data;
    try{
      const rem=await load(f),bc=await DB.get('kv','data').catch(()=>null),base=bc&&bc.repo===S.repo?bc[FK[f]]:null;
      if(base){
        const mr=await mergeAsk(f,base,data,rem);
        if(!mr){const e=new Error('競合の確認を後にしました。設定の「再接続」で、もう一度確認できます');e.cancel=true;throw e}
        nd=mr.m;
        if(!deq(nd,data)){S[FK[f]]=nd;if(!S.ed)setTimeout(render,0)}
      }
    }catch(e){
      if(e.cancel)throw e;
      const g=await fetch(`${API}/repos/${S.repo}/contents/${f}`,{headers:hdr()});
      if(g.ok)S.sha[f]=(await g.json()).sha;
    }
    return put(f,nd,1);
  }
  if(!r.ok)throw new Error('保存できませんでした。もう一度操作してください');
  S.sha[f]=(await r.json()).content.sha;
}
let timer,dirty={};
function save(f){
  S.rev++;
  if(S.off){S.pend[f]=1;lsave();paintOff();status('オフラインで保存しました(つながると自動で送ります)');return}
  dirty[f]=1;status('保存待ち…');clearTimeout(timer);timer=setTimeout(flush,1200);
}
async function flush(){
  const done=[];let cur;
  try{status('保存中…');
    for(const f of Object.keys(dirty)){cur=f;delete dirty[f];await put(f,S[FK[f]]);done.push(f);cur=null}
    cacheData(done);status('保存済み');
  }catch(e){
    if(done.length)cacheData(done);
    if(e.cancel){ /* 競合の確認を「あとで」にした:変更は端末に控えて、再接続で確認 */
      if(cur)S.pend[cur]=1;
      Object.keys(dirty).forEach(f=>{S.pend[f]=1});dirty={};
      S.off=true;S.cfHold=true;lsave(1);paintOff();status(e.message,1);
    }else if(e instanceof TypeError||e.name=='AbortError'||e.name=='TimeoutError'){ /* 通信できない:端末に控えて、つながったら送る */
      if(cur)S.pend[cur]=1;
      Object.keys(dirty).forEach(f=>{S.pend[f]=1});dirty={};
      S.off=true;lsave(1);paintOff();
      status('通信できないため、端末に控えました。つながると自動で送ります',1);
    }else status(e.message,1);
  }
}

function fin(msg,err){
  localStorage.setItem('sm_sess',S.token);
  if(boot){const b=boot;boot=null;applyState(b)}
  status(msg,err);render();
}
async function connect(){
  const rev0=S.rev,wasOff=!!S.off;
  let loc=null;
  if(wasOff&&Object.keys(S.pend).length){loc={repo:S.repo,files:Object.keys(S.pend)};loc.files.forEach(f=>{loc[FK[f]]=S[FK[f]]})}
  else{const l=await DB.get('kv','local').catch(()=>null);if(l&&l.files&&l.files.length)loc=l}
  let repo,rem;
  try{
    repo=await findRepo();S.repo=repo;
    rem=await Promise.all(FILES.map(load));
  }catch(e){
    /* トークンが違う場合以外(オフライン・電波が悪い等)は、前回読み込んだデータで開く */
    if(e.auth)throw e;
    if(wasOff)return; /* まだ圏外。いまの内容のまま */
    const c=await DB.get('kv','data').catch(()=>null);
    if(!c||!c.repo)throw e;
    S.repo=c.repo;S.works=c.works||[];S.chars=c.chars||[];S.gal=c.gal||[];S.sha={};S.pend={};
    if(loc&&loc.repo===c.repo)loc.files.forEach(f=>{S[FK[f]]=loc[FK[f]]||[];S.pend[f]=1});
    S.off=true;
    fin(Object.keys(S.pend).length?'オフライン: 未送信の変更を端末に保存しています':'オフライン: 前回読み込んだデータを表示中',1);return;
  }
  if(wasOff&&S.rev!==rev0)return; /* 接続中に編集された。次の再試行でまとめて送る */
  if(loc&&loc.repo!==repo)loc=null;
  FILES.forEach((f,i)=>{S[FK[f]]=rem[i]});
  let msg=wasOff?'オンラインに戻りました':'接続しました',failed=false;
  const ok=FILES.slice();
  if(loc){
    const bc=await DB.get('kv','data').catch(()=>null),base=bc&&bc.repo===repo?bc:{},st={c:0};
    let sent=0,held=false;
    for(const f of loc.files){
      const k=FK[f],i=FILES.indexOf(f);
      const mr=await mergeAsk(f,base[k],loc[k]||[],rem[i]); /* 同じ欄の競合があれば、ここでポップアップ */
      if(!mr){S[k]=loc[k]||[];S.pend[f]=1;failed=held=true;ok.splice(ok.indexOf(f),1);continue}
      const m=mr.m;st.c+=mr.c;
      try{
        if(!deq(m,rem[i])){S[k]=m;await put(f,m);sent++}
        delete S.pend[f];
      }catch(e){S[k]=loc[k]||[];S.pend[f]=1;failed=true;if(e.cancel)held=true;ok.splice(ok.indexOf(f),1)}
    }
    if(failed){S.off=true;S.cfHold=held;lsave(1);msg=held?'競合の確認を後にしました。設定の「再接続」で、もう一度確認できます':'オフライン中の変更を送れませんでした。あとで自動でもう一度送ります'}
    else{
      DB.del('kv','local').catch(()=>{});S.pend={};
      msg='オフライン中の変更を送りました'+(st.c?`(両方で変更された${st.c}件は、選んだ内容にしました)`:'');
    }
  }
  if(!failed){S.off=false;S.cfHold=false}
  cacheData(ok);
  fin(msg,failed);
}
let resyncing=false;
async function reconnect(quiet){
  if(resyncing)return;
  if(S.ed&&edDirty()){if(!quiet)status('編集中の内容があるので、編集を終えてから再接続してください',1);return}
  if(!quiet)S.cfHold=false;
  resyncing=true;if(!quiet)status('接続しています…');
  try{await connect()}catch(e){if(!quiet)status(e.message,1)}
  finally{resyncing=false}
  if(!quiet){const d=$('#dlg');if(d.open)d.close()}
}
addEventListener('online',()=>{if(S.off&&S.token&&!S.ed&&!S.cfHold)reconnect(1)});
setInterval(()=>{if(S.off&&S.token&&!S.ed&&!S.cfHold&&navigator.onLine!==false)reconnect(1)},30000);
/* 画像をまとめて端末に保存(まだ見ていない画像も、オフラインで見られるように) */
function allImgPaths(){
  const s=new Set(),note=b=>imgIds(b).forEach(i=>s.add(nPath(i)));
  S.works.forEach(w=>{(w.covers||[]).forEach(c=>s.add(c.path));[...(w.notes||[]),...(w.memos||[])].forEach(n=>note(n.body))});
  S.chars.forEach(c=>{charFiles(c).forEach(p=>s.add(p));note(c.body)});
  S.gal.forEach(g=>{(g.imgs||[]).forEach(m=>{if(m.p)s.add(m.p);if(m.t)s.add(m.t)});if(g.type=='novel')note(g.body)});
  return[...s].filter(p=>!isURL(p));

async function offlineAll(){

async function imgURL(path){
  if(isURL(path))return path; /* 外部URLの画像はそのまま表示(保存しない) */

    /* 端末に控えがあればそれを使う(画像のパスは作るたびに別なので、古くなる心配はない) */
    try{const b=await DB.get('img',path);if(b){const u=URL.createObjectURL(b);IMG.set(path,u);return u}}catch(e){}
    const r=await fetch(`${API}/repos/${S.repo}/contents/${path}`,{headers:{...hdr(),Accept:'application/vnd.github.raw+json'}});
    if(!r.ok)throw new Error('画像を読み込めません');
    const bl=await r.blob();DB.set('img',path,bl).catch(()=>{});
    const u=URL.createObjectURL(bl);IMG.set(path,u);return u;
  })();
  IMGP.set(path,pr);

const inl=t=>{

  const ph=[],keep=h=>'\u0001'+(ph.push(h)-1)+'\u0002',al=u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">`;

    .replace(/https?:\/\/[^\s<>"'《》「」『』（）]+/g,u=>{const m=/[.,;:!?、。)]+$/.exec(u),tl=m?m[0]:'',x=m?u.slice(0,-tl.length):u;return x?keep(al(x)+esc(x)+'</a>')+tl:u});
  /* 脚注の番号は、解析が終わった最終的な並び順で振る(解析のやり直しで順番が狂わないように) */
  return deco(t,0,[])[0]
    .replace(/\u0003([^\u0004]*)\u0004/g,(m,k)=>{

/* 文字装飾(太字・斜体・傍点・注意書き・ルビ)の解析。入れ子にできるので、好きなだけ重ねがけできる
   T: 文字列 / i: 読み始めの位置 / stops: この位置で閉じる記号の候補 → [HTML, 次の位置, 閉じたか] */
const KJ=/[一-龠々〆ヶ]/;
function decoTxt(b){
  let r=esc(b);
  if(FN)r=r.replace(/\[\^([^\]\s]+)\]/g,(m,k)=>FN.defs.has(k)?'\u0003'+k+'\u0004':m);
  return r;
}
function deco(T,i,stops){
  let h='',buf='';
  const fl=()=>{if(buf){h+=decoTxt(buf);buf=''}};
  const sub=(open,st,wrap)=>{
    const [x,j,ok]=deco(T,i+open.length,st);
    if(ok&&x){fl();h+=wrap(x);i=j;return true}
    return false;
  };
  const strong=x=>`<strong>${x}</strong>`,em=x=>`<em>${x}</em>`,bt=x=>`<span class="bt">${x}</span>`,sm=x=>`<span class="sm">${x}</span>`;
  while(i<T.length){
    const st=stops.find(s=>T.startsWith(s,i));
    if(st){
      /* 斜体の中で ** が来たら、まず太字の開始として読んでみる(*斜体 **太字** 斜体* の重ねがけ) */
      if(st=='*'&&T.startsWith('**',i)&&sub('**',['**'],strong))continue;
      fl();return [h,i+st.length,true];
    }
    const c=T[i];
    if(T.startsWith('《《',i)){if(!sub('《《',['》》'],bt)){buf+='《《';i+=2}continue}
    if(T.startsWith('((',i)||T.startsWith('（（',i)){const o=T.substr(i,2);if(!sub(o,['))','））'],sm)){buf+=o;i+=2}continue}
    if(T.startsWith('**',i)){if(!sub('**',['**'],strong)){buf+='**';i+=2}continue}
    if(c=='*'){if(!sub('*',['*'],em)){buf+='*';i++}continue}
    if(c=='｜'||c=='|'){
      let k=i+1;
      while(k<T.length&&!(T[k]=='《'&&T[k+1]!='《')){k+=(T[k]=='《'?2:1)}
      const e=k<T.length?T.indexOf('》',k+1):-1;
      if(k>i+1&&e>k+1){fl();h+=`<ruby>${deco(T.slice(i+1,k),0,[])[0]}<rt>${esc(T.slice(k+1,e))}</rt></ruby>`;i=e+1;continue}
      buf+=c;i++;continue;
    }
    if(KJ.test(c)){
      let k=i;while(k<T.length&&KJ.test(T[k]))k++;
      if(T[k]=='《'&&T[k+1]!='《'){
        const e=T.indexOf('》',k+1);
        if(e>k+1){fl();h+=`<ruby>${esc(T.slice(i,k))}<rt>${esc(T.slice(k+1,e))}</rt></ruby>`;i=e+1;continue}
      }
      buf+=T.slice(i,k);i=k;continue;
    }
    buf+=c;i++;
  }
  fl();return [h,i,false];
}
/* 行頭の全角スペース(・タブ)の数ぶん、見出し・引用・カード・折りたたみ・画像・動画・ギャラリー作品も字下げする */
const bare=l=>l.replace(/^[　\t]+/,'');
const indW=(h,n)=>n?`<div class="ind" style="--n:${n}">${h}</div>`:h;
function one(line,out){
  const rest=bare(line),n=line.length-rest.length;
  const h=/^(#{1,3}) (.*)$/.exec(rest);
  if(h){out.push(`<div class="hd h${h[1].length}"${n?` style="margin-left:${n}em"`:''}>${inl(h[2])}</div>`);return}
  const ln=t=>out.push(`<div class="ln">${t?inl(t):'<br>'}</div>`);
  /* URLだけの行: YouTube・Vimeo・ニコニコ・mp4 はそのまま再生できる形で表示 */
  const u=rest.trim();
  if(/^https?:\/\/\S+$/i.test(u)){const v=vidEmbed(u);if(v){out.push(indW(`<div class="vb">${v}</div>`,n));return}}
  if(!/\[\[(?:img|gal):/.test(line)){ln(line);return}
  const re=/\[\[(img|gal):([\w-]+)\]\]/g;let last=0,m;
  while((m=re.exec(line))){
    const tx=line.slice(last,m.index);if(tx.trim())ln(tx);
    out.push(indW(m[1]=='gal'?galEmbed(m[2]):`<div class="im"><img data-p="${esc(nPath(m[2]))}" alt="画像"></div>`,n));last=m.index+m[0].length;
  }
  const tx=line.slice(last);if(tx.trim())ln(tx);
}
const FOLD=/^~~~(\+?)(?:[ 　]+(.*))?$/;
function blocks(lines,out,inCard){
  let i=0;
  while(i<lines.length){
    const line=lines[i],bl=bare(line),n=line.length-bl.length,fm=FOLD.exec(bl);
    /* 折りたたみ: 「~~~ タイトル」(最初は閉じる) / 「~~~+ タイトル」(最初から開く) 〜 「~~~」 */
    if(fm&&(fm[1]||(fm[2]||'').trim())){
      let j=i+1,d=1;
      while(j<lines.length){const m=FOLD.exec(bare(lines[j]));if(m){if(m[1]||(m[2]||'').trim())d++;else d--;if(!d)break}j++}
      const sub=[];blocks(lines.slice(i+1,j),sub,inCard);
      out.push(indW(`<details class="fold"${fm[1]?' open':''}><summary>${inl((fm[2]||'').trim())||'折りたたみ'}</summary><div class="fb">${sub.join('')}</div></details>`,n));
      i=j+1;continue;
    }
    const f=!inCard&&/^```\s*$/.test(bl);
    if(f){
      let j=i+1;while(j<lines.length&&!/^```\s*$/.test(bare(lines[j])))j++;
      const sub=[];blocks(lines.slice(i+1,j),sub,1);
      out.push(indW(`<div class="cd">${sub.join('')}</div>`,n));
      i=j+1;continue;
    }
    if(bl.startsWith('>')){
      const q=[];while(i<lines.length&&bare(lines[i]).startsWith('>')){q.push(bare(lines[i]).replace(/^> ?/,''));i++}
      const sub=[];blocks(q,sub,inCard);
      out.push(indW(`<blockquote class="qt">${sub.join('')}</blockquote>`,n));
      continue;
    }
    one(line,out);i++;
  }
}
function rich(src,fn=true){

async function copyImg(path,np){
  if(isURL(path))return false; /* URL画像は複製しても同じURLのまま */
  let b=null;
  try{b=await DB.get('img',path)}catch(e){}
  if(!b){
    const r=await fetch(`${API}/repos/${S.repo}/contents/${path}`,{headers:{...hdr(),Accept:'application/vnd.github.raw+json'}});
    if(r.status==404)return false; /* 元の画像がもう無い:そのまま(元と同じ表示)にする */
    if(!r.ok)throw new Error('画像を読み込めませんでした');
    b=await r.blob();
  }
  const r=await fetch(`${API}/repos/${S.repo}/contents/${np}`,{method:'PUT',headers:hdr(),body:JSON.stringify({message:'copy image',content:await b64blob(b)})});
  if(!r.ok)throw new Error('画像を保存できませんでした');

function curTa(){const t=S.tx;return t&&document.body.contains(t)?t:$('#eb')}
function fmt(k){
  const t=curTa();if(!t)return;
  const a=t.selectionStart,b=t.selectionEnd,v=t.value,sel=v.slice(a,b);
  if(k=='h'){
    const ls=a?v.lastIndexOf('\n',a-1)+1:0,hs=ls+/^[　\t]*/.exec(v.slice(ls,ls+200))[0].length,m=/^(#{1,3}) /.exec(v.slice(hs,hs+5)),old=m?m[0].length:0,lv=m?m[1].length:0,nw=lv>=3?'':'#'.repeat(lv+1)+' ';
    insText(t,hs,hs+old,nw);const d=nw.length-old,sh=p=>p>=hs?p+d:p;t.setSelectionRange(sh(a),sh(b));return;
  }
  const W={b:['**','**','太字'],i:['*','*','斜体'],d:['《《','》》','強調'],n:['((','))','注意書き']}[k];
  if(W){const x=sel||W[2];insText(t,a,b,W[0]+x+W[1]);t.setSelectionRange(a+W[0].length,a+W[0].length+x.length);return}
  if(k=='r'){
    if(sel){insText(t,a,b,`｜${sel}《》`);const c=a+sel.length+2;t.setSelectionRange(c,c)}
    else{insText(t,a,b,'｜漢字《かんじ》');t.setSelectionRange(a+1,a+3)}
    return;
  }
  if(k=='f'){
    if(t.id!='eb'){status('脚注は詳細情報(本文)でのみ使えます');return}
    const n=Math.max(0,...[...v.matchAll(/\[\^(\d+)\]/g)].map(m=>+m[1]))+1;
    insText(t,b,b,`[^${n}]`);
    const e=t.value.length;
    insText(t,e,e,(t.value.endsWith('\n')?'':'\n')+`[^${n}]: `);
    t.setSelectionRange(t.value.length,t.value.length);return;
  }
  if(k=='ti'||k=='to'){
    const ls=a?v.lastIndexOf('\n',a-1)+1:0,e=b>a&&v[b-1]=='\n'?b-1:b;
    let le=v.indexOf('\n',e);if(le<0)le=v.length;
    const old=v.slice(ls,le),nw=old.split('\n').map(l=>k=='ti'?'　'+l:l.replace(/^(　|\t| )/,'')).join('\n');
    if(nw==old)return;
    insText(t,ls,le,nw);
    if(a==b){const c=Math.max(ls,a+nw.length-old.length);t.setSelectionRange(c,c)}else t.setSelectionRange(ls,ls+nw.length);
    return;
  }
  if(k=='q'){
    const ls=a?v.lastIndexOf('\n',a-1)+1:0,e=b>a&&v[b-1]=='\n'?b-1:b;
    let le=v.indexOf('\n',e);if(le<0)le=v.length;
    const L=v.slice(ls,le).split('\n'),all=L.every(l=>bare(l).startsWith('>'));
    const nw=L.map(l=>{const b=bare(l),ind=l.slice(0,l.length-b.length);return all?ind+b.replace(/^> ?/,''):ind+'> '+b}).join('\n');
    insText(t,ls,le,nw);t.setSelectionRange(ls+nw.length,ls+nw.length);return;
  }
  if(k=='fo'||k=='fp'){
    const head='~~~'+(k=='fp'?'+':'')+' タイトル';
    if(a==b){
      const pre=a&&v[a-1]!='\n'?'\n':'',suf=b<v.length&&v[b]!='\n'?'\n':'';
      insText(t,a,b,pre+head+'\n\n~~~'+suf);
      const s=a+pre.length+head.length-4;t.setSelectionRange(s,s+4);
    }else{
      const ls=a?v.lastIndexOf('\n',a-1)+1:0,e=v[b-1]=='\n'?b-1:b;
      let le=v.indexOf('\n',e);if(le<0)le=v.length;
      insText(t,ls,le,head+'\n'+v.slice(ls,le)+'\n~~~');
      t.setSelectionRange(ls+head.length-4,ls+head.length);
    }
    return;
  }
  if(k=='c'){
    const pre=a&&v[a-1]!='\n'?'\n':'',suf=b<v.length&&v[b]!='\n'?'\n':'';
    insText(t,a,b,pre+'```\n'+sel+'\n```'+suf);
    const c=a+pre.length+4+sel.length;t.setSelectionRange(sel?c+4:c,sel?c+4:c);
  }
}

function dragStart(e){
  e.preventDefault();
  const h=e.currentTarget,li=h.closest('.item'),list=li.parentNode,t=li.dataset.t;
  let tg=null,after=false;
  const clr=()=>list.querySelectorAll('.ins-b,.ins-a').forEach(n=>n.classList.remove('ins-b','ins-a'));
  li.classList.add('drag');h.setPointerCapture(e.pointerId);
  h.onpointermove=ev=>{
    const el=document.elementFromPoint(ev.clientX,ev.clientY),n=el&&el.closest('.item');
    clr();tg=null;
    if(!n||n==li||n.parentNode!=list||n.dataset.t!=t||(n.dataset.g||'')!=(li.dataset.g||''))return;
    const r=n.getBoundingClientRect(),hz=(list.classList.contains('grid')||list.classList.contains('gg'))&&r.width<list.clientWidth*.7;after=hz?ev.clientX>r.left+r.width/2:ev.clientY>r.top+r.height/2;tg=n;n.classList.add(after?'ins-a':'ins-b');
  };
  h.onpointerup=h.onpointercancel=()=>{
    h.onpointermove=h.onpointerup=h.onpointercancel=null;clr();li.classList.remove('drag');
    if(!tg)return;
    if(t=='gi'||t=='gf'){
      /* ギャラリー: 同じフォルダ・同じ種類(フォルダ/作品)の全体を並べ直す(絞り込み中でも崩れないように) */
      const me=S.gal.find(x=>x.id==li.dataset.id),to=S.gal.find(x=>x.id==tg.dataset.id);
      if(me&&to){
        const ix=new Map(S.gal.map((x,i)=>[x,i])),full=S.gal.filter(x=>gIsF(x)==gIsF(me)&&par(x)==par(me)).sort((a,b)=>(a.o??ix.get(a))-(b.o??ix.get(b))).filter(x=>x!=me);
        full.splice(full.indexOf(to)+(after?1:0),0,me);
        full.forEach((x,k)=>x.o=k);
        save('gallery.json');
      }
      render();return;
    }
    const w=S.works.find(x=>x.id==S.workId),o=[...list.querySelectorAll('.item')].filter(n=>n.dataset.t==t&&(n.dataset.g||'')==(li.dataset.g||'')).map(n=>n.dataset.id).filter(i=>i!=li.dataset.id);
    o.splice(o.indexOf(tg.dataset.id)+(after?1:0),0,li.dataset.id);
    if(t=='w'){
      o.forEach((i,k)=>{const x=S.works.find(y=>y.id==i);if(x)x.o=k});
      save('works.json');render();return;
    }
    if(t=='c'||t=='k'||t=='m'){
      const arr=t=='k'?w.cats:t=='m'?w.memos:S.chars;
      o.forEach((i,k)=>{const x=arr.find(y=>y.id==i);if(x)x.o=k});
      save(t=='c'?'characters.json':'works.json');render();return;
    }
    const m=new Map(w.notes.map(x=>[x.id,x]));let a=0,b=0;
    o.forEach(i=>{const x=m.get(i);x.o=isF(x)?a++:b++});
    save('works.json');render();
  };
}

async function toWebp(f,q=1,max=0){
  const bm=await createImageBitmap(f),cv=document.createElement('canvas');
  let w=bm.width,h=bm.height;
  if(max&&Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bm,0,0,w,h);
  const b=await new Promise(r=>cv.toBlob(r,'image/webp',q));
  if(!b||b.type!='image/webp')throw new Error('このブラウザはWebPへの変換に対応していません');
  return b;
}

/* 動画URL → 埋め込み情報(YouTube / Vimeo / ニコニコ / 動画ファイル / それ以外はリンク) */
const secOf=t=>{if(!t)return 0;t=String(t);if(/^\d+$/.test(t))return +t;const m=t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
function galVid(u){
  let url,m;
  try{url=new URL(String(u||'').trim())}catch(e){return null}
  if(!/^https?:$/.test(url.protocol))return null;
  const h=url.hostname.replace(/^www\.|^m\./,''),st=secOf(url.searchParams.get('t')||url.searchParams.get('start'));
  let id=null;
  if(h=='youtu.be')id=url.pathname.slice(1).split('/')[0];
  else if(h=='youtube.com'||h=='youtube-nocookie.com'||h=='music.youtube.com'){
    if(url.pathname=='/watch')id=url.searchParams.get('v');
    else if(m=url.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{6,})/))id=m[1];
  }
  if(id&&/^[\w-]{6,}$/.test(id))return{k:'yt',embed:`https://www.youtube.com/embed/${id}${st?`?start=${st}`:''}`,thumb:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`,ratio:url.pathname.startsWith('/shorts/')?'9/16':'16/9'};
  if(h=='vimeo.com'&&(m=url.pathname.match(/^\/(\d+)/)))return{k:'vimeo',embed:`https://player.vimeo.com/video/${m[1]}`,ratio:'16/9'};
  if(h=='nicovideo.jp'&&(m=url.pathname.match(/\/watch\/((?:sm|nm|so)?\d+)/)))return{k:'nico',embed:`https://embed.nicovideo.jp/watch/${m[1]}`,ratio:'16/9'};
  if(/\.(mp4|webm|mov|m4v|ogv)$/i.test(url.pathname))return{k:'file',src:url.href};
  return{k:'link',src:url.href};
}

/* 本日のピックアップ: 日付ごとに固定のランダムで2作品(作品フィルター中はその作品の中から) */
function galPick(){
  const wk=galWk();
  const pool=S.gal.filter(g=>!gIsF(g)&&(wk=='all'||g.workId==wk)).sort((a,b)=>String(a.id)<String(b.id)?-1:1);
  if(pool.length<=2)return pool;
  const d=new Date(),day=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  /* その日のピックアップは端末に覚えておく(作品を追加しても入れ替わらない)。消された分だけ補充する */
  let st;try{st=JSON.parse(cGet('sm_gpick','null'))}catch(e){st=null}
  if(!st||st.day!=day||!st.ids)st={day,ids:{}};
  let ids=(st.ids[wk]||[]).filter(id=>pool.some(g=>g.id==id));
  if(ids.length<2){
    let a=0;
    for(const c of `${day}|${wk}`){a=Math.imul(a^c.charCodeAt(0),16777619)}
    const rnd=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296};
    const r=pool.filter(g=>!ids.includes(g.id));
    for(let i=r.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
    ids=[...ids,...r.slice(0,2-ids.length).map(g=>g.id)];
  }
  st.ids[wk]=ids;cSet('sm_gpick',JSON.stringify(st));
  return ids.map(id=>pool.find(g=>g.id==id)).filter(Boolean);
}

function pHeight(v){
  const t=String(v||'').normalize('NFKC');
  let m=t.match(/(\d)\s*m\s*(\d{1,2})(?!\d)/i),n;
  if(m)n=+m[1]*100+ +m[2];
  else{m=t.match(/(\d+(?:\.\d+)?)/);if(!m)return null;n=parseFloat(m[1]);if(n<3)n*=100}
  return n>=30&&n<=300?Math.round(n*10)/10:null;
}
/* 年齢: 「18歳」のような数字のほか、「20代」「20代後半」「二十代前半」などのざっくり表記も拾う
   戻り値 {v:並べ替え用の数値, rough:ざっくりか, b:十の位(代), sub:前半/中盤/後半} */
const KN={'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function pAge(v){
  const t=String(v||'').normalize('NFKC');
  let b=null,sub='',m=t.match(/(\d{1,2})\s*代\s*(前半|中盤|中頃|後半|前|中|後)?/);
  if(m&&+m[1]>=10&&+m[1]%10==0){b=+m[1];sub=m[2]||''}
  else{
    m=t.match(/([二三四五六七八九])?十\s*代\s*(前半|中盤|中頃|後半|前|中|後)?/);
    if(m){b=(KN[m[1]]||1)*10;sub=m[2]||''}
  }
  if(b!=null){
    sub=/前/.test(sub)?'前半':/後/.test(sub)?'後半':/中/.test(sub)?'中盤':'';
    return{v:b+(sub=='前半'?3:sub=='後半'?7:5),rough:true,b,sub};
  }
  m=t.match(/(\d{1,4})/);
  if(!m||t.charAt(m.index+m[1].length)=='代')return null;
  return{v:+m[1],rough:false};
}
function pBd(v){
  const t=String(v||'').normalize('NFKC');
  const m=t.match(/(?:\d{4}\s*[年\/\-.]\s*)?(\d{1,2})\s*[月\/\-.]\s*(\d{1,2})/);
  if(!m)return null;
  const mo=+m[1],d=+m[2],dm=[31,29,31,30,31,30,31,31,30,31,30,31];
  return mo>=1&&mo<=12&&d>=1&&d<=dm[mo-1]?{m:mo,d}:null;
}
function hsvOf(hex){
  let h=String(hex||'').replace('#','');if(h.length==3)h=h.replace(/./g,'$&$&');
  const n=parseInt(h.slice(0,6),16);if(isNaN(n))return{h:0,s:0,v:.5};
  const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let hh=0;
  if(d){hh=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;hh*=60;if(hh<0)hh+=360}
  return{h:hh,s:mx?d/mx:0,v:mx};
}
const cAv=(c,cls)=>`<span class="dot ${cls}" style="--c:${esc(c.color)}"${c.icon?` data-ic="${esc(c.icon)}"`:''}></span>`;
const cTile=(c,top)=>`<button class="bdc" onclick="openChar('${c.id}')" title="${esc(c.name)}">${top}${cAv(c,'cm')}<span class="bdn">${esc(c.name)}</span></button>`;
const cmpUn=(label,a)=>a.length?`<div class="cun"><div class="mut">${label}(${a.length}人)</div><div class="tabs2">${a.map(c=>`<button class="btn chip sub" onclick="openChar('${c.id}')">${esc(c.name)}</button>`).join('')}</div></div>`:'';

/* 色相環: 角度=色相、中心からの距離=彩度(鮮やかなほど内側)。重なったアイコンは少しずらす */
function ringPos(list){
  /* 色相環の中心は左寄り(44%)。右端の縦バーは無彩色用(上=白 → 下=黒、明るさで位置が決まる) */
  const n=list.length,sz=Math.max(5,12*Math.sqrt(20/Math.max(n,20))),cx=44,rmin=16+sz/2,rmax=46-sz/2;
  const P=list.map(c=>{
    const o=hsvOf(c.color),a=o.h*Math.PI/180;
    if(o.s<.08)return{c,o,ach:1,x:94,y:10+80*(1-o.v)};
    const r=rmax-(rmax-rmin)*o.s;return{c,o,x:cx+r*Math.sin(a),y:50-r*Math.cos(a)};
  });
  const md=sz*1.04;
  for(let it=0;it<120;it++){
    let mv=false;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
      const A=P[i],B=P[j];
      if(A.ach!=B.ach)continue;
      if(A.ach){
        let dy=B.y-A.y;const d=Math.abs(dy);
        if(d>=md)continue;
        if(d<.01)dy=j>i?.01:-.01;
        const f=(md-d)/2,s=dy>=0?1:-1;A.y-=s*f;B.y+=s*f;mv=true;continue;
      }
      let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
      if(d>=md)continue;
      if(d<.01){dx=Math.cos(i*2.4);dy=Math.sin(i*2.4);d=1}
      const f=(md-d)/2/d;A.x-=dx*f;A.y-=dy*f;B.x+=dx*f;B.y+=dy*f;mv=true;
    }
    P.forEach(p=>{
      if(p.ach){p.y=Math.min(92,Math.max(8,p.y));return}
      const dx=p.x-cx,dy=p.y-50,r=Math.hypot(dx,dy)||1,c=Math.min(rmax,Math.max(rmin,r));if(c!=r){p.x=cx+dx/r*c;p.y=50+dy/r*c}
    });
    if(!mv)break;
  }
  return{P,sz};
}
function cmpRing(list){
  const {P,sz}=ringPos(list),cur=list.find(c=>c.id==S.csel);
  const wt=id=>(S.works.find(w=>w.id==id)||{}).title||'';
  const info=cur?(()=>{const o=hsvOf(cur.color);return `<div class="pc cinf">${cAv(cur,'')}<div class="cinfo"><b>${esc(cur.name)}</b><span class="mut">${cmpWk()=='all'?esc(wt(cur.workId))+' / ':''}${esc(cur.color)} / 色相${Math.round(o.h)}°</span></div><button class="btn sub chip" onclick="openChar('${cur.id}')">詳細 ›</button></div>`})():`<p class="mut chint">キャラをタップすると名前が出ます</p>`;
  return `<div class="cstage${cur?' has':''}" onclick="cmpSel(null)"><div class="cring"></div><div class="cbar"></div>${cur?`<div class="cface" style="--c:${esc(cur.color)}"${cur.icon?` data-ic="${esc(cur.icon)}"`:''}></div>`:'<div class="cface">タップして<br>選択</div>'}${P.map(p=>`<button class="cdot${p.c.id==S.csel?' on':''}" style="left:${p.x.toFixed(2)}%;top:${p.y.toFixed(2)}%;--s:${sz.toFixed(2)}%;--c:${esc(p.c.color)}"${p.c.icon?` data-ic="${esc(p.c.icon)}"`:''} title="${esc(p.c.name)}" aria-label="${esc(p.c.name)}" onclick="event.stopPropagation();cmpSel('${p.c.id}')"></button>`).join('')}</div>${info}`;
}

/* 身長比較: 人数に合わせて高さ(--ch)を自動調整。入りきらないときは横スクロール */
const FIG='<circle cx="35" cy="11.5" r="11.5"/><path d="M21.6 31.6Q21.5 26.5 26.7 26.5L43.3 26.5Q48.5 26.5 48.4 31.6L47.5 85.6Q47.4 91.8 41.2 91.8L28.8 91.8Q22.6 91.8 22.5 85.6Z"/><rect x="11.2" y="26.5" width="8.3" height="69.8" rx="4.1"/><rect x="50.5" y="26.5" width="8.3" height="69.8" rx="4.1"/><rect x="22.1" y="86.1" width="11.4" height="88.9" rx="5.7"/><rect x="36.6" y="86.1" width="11.4" height="88.9" rx="5.7"/>';
function cmpHeight(list){
  const rows=list.map(c=>({c,h:pHeight(cInfo(c,'身長'))})),ok=rows.filter(r=>r.h),so=cmpSo();
  const un=cmpUn('身長が未入力',rows.filter(r=>!r.h).map(r=>r.c));
  if(!ok.length)return `<div class="empty">身長が入力されたキャラがいません</div>`+un;
  if(so=='asc')ok.sort((a,b)=>a.h-b.h);else if(so=='desc')ok.sort((a,b)=>b.h-a.h);
  const top=Math.max(160,Math.ceil((Math.max(...ok.map(r=>r.h))+2)/20)*20),W=47.6/175;

  let rul='';for(let v=20;v<=top;v+=20)rul+=`<div class="hrl${v==100?' rm':''}" style="bottom:${(v/top*100).toFixed(2)}%"><b>${v==top?v+'cm':v}</b></div>`;
  const cols=ok.map(r=>{const k=r.h/top,w=W*k;return `<button class="hcol" style="--c:${esc(r.c.color)};--w:${w.toFixed(4)}" data-w="${w.toFixed(4)}" onclick="openChar('${r.c.id}')" title="${esc(r.c.name)} ${r.h}cm"><span class="hfg"><svg viewBox="11.2 0 47.6 175" preserveAspectRatio="xMidYMax meet" style="height:calc(var(--ch)*${k.toFixed(4)});width:calc(var(--ch)*${w.toFixed(4)})" aria-hidden="true"><g class="fo">${FIG}</g><g class="ff">${FIG}</g></svg></span>${cAv(r.c,'')}<span class="hgt">${r.h}<span class="cmu">cm</span></span><span class="hnm">${esc(r.c.name)}</span></button>`}).join('');
  return `<div class="hscroll"><div class="hin" style="--n:${ok.length};--tw:${tw.toFixed(4)}"><div class="hrul">${rul}</div><div class="hcols">${cols}</div></div></div>`+un;

/* 人数と画面幅に合わせて高さ(--ch)と列の最小幅(--mw)を決める。全員が収まる最大の高さにする */
function hFit(){
  const sc=document.querySelector('.hscroll'),hin=sc&&sc.querySelector('.hin');
  if(!hin)return;
  const cols=[...hin.querySelectorAll('.hcol')],n=cols.length;
  if(!n)return;
  const ws=cols.map(c=>parseFloat(c.dataset.w)||0),avail=sc.clientWidth-68,gap=2*(n-1);
  if(avail<=0)return;
  const mw=Math.max(20,Math.min(40,Math.floor((avail-gap)/n)));
  const need=ch=>ws.reduce((s,w)=>s+Math.max(mw,ch*w+4),0)+gap;
  let ch;
  if(need(360)<=avail)ch=360;
  else if(need(50)>avail)ch=50;
  else{let lo=50,hi=360;for(let i=0;i<24;i++){const m=(lo+hi)/2;if(need(m)<=avail)lo=m;else hi=m}ch=lo}
  hin.style.setProperty('--ch',ch.toFixed(1)+'px');
  hin.style.setProperty('--mw',mw+'px');
  hin.classList.toggle('tight',mw<34);
}
addEventListener('resize',hFit);

/* 誕生日: 月ごと(今月の枠は強調) */
function cmpBd(list){
  const rows=list.map(c=>({c,b:pBd(cInfo(c,'誕生日'))})),now=new Date().getMonth()+1;
  const EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const sec=EN.map((en,i)=>{

  }).join('');
  return `<div class="bdg">${sec}</div>`+cmpUn('誕生日が未入力',rows.filter(r=>!r.b).map(r=>r.c));
}

/* 年齢: 10歳ごと */
function cmpAge(list){

    return `<section class="bdm"><h4 class="bdh"><b>${k?k:10}</b><i>${k?'代':'歳未満'}</i></h4><div class="bdl">${a.map(r=>cTile(r.c,`<span class="bdd">${r.a.rough?`${r.a.b}<small>代${r.a.sub}</small>`:`${r.a.v}<small>歳</small>`}</span>`)).join('')}</div></section>`;
  }).join('')}</div>`+un;
}

function cmpBase(){
  const wk=cmpWk(),ord=new Map(S.works.map((w,i)=>[w.id,i]));
  return S.chars.map((c,i)=>({c,i})).filter(o=>wk=='all'||o.c.workId==wk).sort((a,b)=>(ord.get(a.c.workId)??9e3)-(ord.get(b.c.workId)??9e3)||a.i-b.i).map(o=>o.c);
}

  const m=cmpM();

  let list=base;
  if(cOnly()){const p=cPick();list=base.filter(c=>p.has(c.id))}
  if(!list.length)return `<div class="empty">キャラが選ばれていません。上の一覧から名前を押して選んでください</div>`;
  return m=='ring'?cmpRing(list):m=='h'?cmpHeight(list):m=='bd'?cmpBd(list):cmpAge(list);
}
const cChip=(c,p)=>`<button class="btn chip${p.has(c.id)?'':' sub'}" data-id="${c.id}" onclick="cmpToggle('${c.id}')"><i class="sw" style="background:${esc(c.color)}"></i>${esc(c.name)}</button>`;
function cmpView(){
  const app=$('#app'),wk=cmpWk(),m=cmpM(),so=cmpSo(),on=cOnly(),base=cmpBase(),p=cPick();
  const sortOpt=m=='h'?[['reg','登録順'],['asc','低い順'],['desc','高い順']]:m=='age'?[['reg','登録順'],['asc','若い順'],['desc','年上順']]:null;
  const body=cmpBody(base);
  const onBar=`<div class="bar" style="flex-wrap:wrap;margin-bottom:10px"><button class="btn${on?'':' sub'}" onclick="cmpOnlyToggle()">${on?'☑':'☐'} 選んだキャラだけ表示 <span id="cpn">${on?`(${base.filter(c=>p.has(c.id)).length}人)`:''}</span></button>${on?'':'<span class="mut">ONにして、一覧の名前を押して選びます</span>'}</div>
  ${on&&base.length?`<div class="cpp"><div class="bar" style="margin-bottom:8px"><span class="mut">名前を押して選ぶ / 外す</span><button class="btn sub chip" style="margin-left:auto" onclick="cmpAll(1)">全員選ぶ</button><button class="btn sub chip" onclick="cmpAll(0)">全員外す</button></div><div class="cpl" id="cpl">${base.map(c=>cChip(c,p)).join('')}</div></div>`:''}`;
  app.innerHTML=`<div class="csel"><select aria-label="作品" onchange="setCmpW(this.value)"><option value="all"${wk=='all'?' selected':''}>全ての作品</option>${S.works.map(w=>`<option value="${w.id}"${w.id==wk?' selected':''}>${esc(w.title)}</option>`).join('')}</select></div>
  <div class="ctabs">${CMODES.map(([k,l])=>`<button class="btn ${k==m?'':'sub'}" onclick="setCmpM('${k}')">${l}</button>`).join('')}</div>
  ${onBar}
  ${sortOpt?`<div class="bar"><span class="mut">並び替え</span><select aria-label="並び替え" onchange="setCmpS(this.value)">${sortOpt.map(([k,l])=>`<option value="${k}"${k==so?' selected':''}>${l}</option>`).join('')}</select></div>`:''}
  <div id="cbody">${body}</div>`;
  hydrate(app);hFit();
}

<script>

(()=>{
const BASE_REPO='cheeees/sosaku-matome',DIR='data/preset',KEY='sm_shtpl',FKEY='sm_shfile';

/* --- データ形式の変換 (リポジトリのJSON ⇔ エディタ内部) --- */
const strip = (v, ch) => String(v ?? '').replace(new RegExp('^' + ch + '\\s*'), '');
function allItems(t) {
  if (t.type === 'table') return t.rows;
  if (t.type === 'timeline') return [];
  if (t.type === 'groups') { const g = []; t.gsec.forEach(x => x.items.forEach(i => g.push(i))); return g; }
  const a = [];

}
function isH(r) { return !!r && r.heading !== undefined; }   // 見出し行(idなし)
function fix(t) {   // 項目idと次の番号を整える
  const items = allItems(t).filter(i => !isH(i));
  let n = (t.nextId || 1) - 1;
  items.forEach(i => { const m = /^i(\d+)$/.exec(i.id || ''); if (m) n = Math.max(n, +m[1]); });

}

    if (!t.rows.length) t.rows = [{ label: '項目' }];
  } else if (!tl && !gp) {
    t.sections = (d.sections || []).map(x => ({

    o.type = 'groups';

    if (t.layout === 'stack') o.layout = 'stack';
    o.nextId = t.nextId;
    o.sections = t.gsec.map(x => {
      const y = { title: x.title };
      if (x.desc) y.desc = x.desc;

  if (t.type === 'timeline') {

    o.name = t.title;
    if (t.desc) o.desc = t.desc;

    if (t.desc) o.desc = t.desc;
    if (t.layout === 'stack') o.layout = 'stack';

/* --- GitHub(基本シート=公開リポジトリ / 自分のシート=トークンのリポジトリ) --- */
const repoOf=s=>s=='base'?BASE_REPO:S.repo;
async function gh(src,path,raw){
  const url=`${API}/repos/${repoOf(src)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const h=raw?{Accept:'application/vnd.github.raw+json'}:{Accept:'application/vnd.github+json'};
  let r=await fetch(url,{headers:{...h,Authorization:'Bearer '+S.token},cache:'no-store'});
  if(src=='base'&&!r.ok)r=await fetch(url,{headers:h,cache:'no-store'}); /* トークンの対象外でも公開リポジトリなら読める */
  return r;
}
async function listSrc(src){
  const r=await gh(src,DIR);
  if(r.status==404)return [];
  if(!r.ok)throw new Error((src=='base'?'基本シート':'自分のシート')+'の一覧を取得できません(HTTP '+r.status+')');
  const a=await r.json();
  return (Array.isArray(a)?a:[]).filter(f=>f.type=='file'&&/\.json$/i.test(f.name)).map(f=>f.name).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
}
async function readSheet(src,name,force){
  const k=src+':'+name;
  if(cache[k]&&!force)return cache[k];
  try{
    const r=await gh(src,DIR+'/'+name,1);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=JSON.parse(await r.text());
    DB.set('kv','sheet:'+k,d).catch(()=>{});
    return cache[k]=d;
  }catch(e){
    /* オフラインなどで読めないときは、前に読んだシートを使う */
    const d=await DB.get('kv','sheet:'+k).catch(()=>null);
    if(d)return cache[k]=d;
    throw e;
  }
}
function fillSel(){
  const sel=$('#shSel');if(!sel)return;
  const o=(s,a)=>a.map(n=>`<option value="${s}:${esc(n)}">${esc(titleOf(s,n))}(${esc(n)})</option>`).join('');
  sel.innerHTML=`<option value="">— 保存済みのシートを選ぶ —</option><optgroup label="基本シート(${lists.base.length})">${o('base',lists.base)}</optgroup><optgroup label="自分のシート(${lists.user.length})">${o('user',lists.user)}</optgroup>`;
  refreshCur();
}
async function listAll(){
  say('シートの一覧を読み込み中…');
  const [b,u]=await Promise.allSettled([listSrc('base'),listSrc('user')]);
  lists.base=b.status=='fulfilled'?b.value:[];lists.user=u.status=='fulfilled'?u.value:[];
  loadedAt=Date.now();fillSel();
  const errs=[b,u].filter(x=>x.status=='rejected').map(x=>x.reason.message);
  say(errs.join(' / '),!!errs.length);
  /* タイトルを読んでプルダウンに反映(失敗しても無視) */
  await Promise.allSettled([...lists.base.map(n=>readSheet('base',n)),...lists.user.map(n=>readSheet('user',n))]);
  fillSel();
}
async function loadSheet(src,name){
  say(name+' を読み込み中…');
  try{
    const d=await readSheet(src,name,1);
    tpl=fromFile(JSON.parse(JSON.stringify(d)));cur={src,name};dirty=false;save();
    edit();if(vmode=='pv')show('pv');refreshCur();
    say(src=='base'?'基本シート '+name+' を開きました。保存すると自分のシートに追加されます':name+' を開きました');
  }catch(e){say(name+' を読み込めませんでした('+e.message+')',true);refreshCur()}
}
function nextName(){
  let max=0,pre='';
  lists.user.forEach(f=>{const m=/^(.*?)(\d+)\.json$/i.exec(f);if(m){max=Math.max(max,+m[2]);pre=m[1]}});
  return (lists.user.length?pre:'my-')+String(max+1).padStart(2,'0')+'.json';
}
async function saveSheet(){
  let name=cur&&cur.src=='user'?cur.name:null;
  if(name){if(!confirm(name+' を上書き保存しますか?'))return}
  else{
    name=prompt('自分のシートとして保存します。ファイル名を入力してください',nextName());
    if(!name)return;
    name=name.trim();if(!/\.json$/i.test(name))name+='.json';
    if(!/^[\w.\-]+$/.test(name)){say('ファイル名には英数字・「-」「_」「.」だけ使えます',true);return}
    if(lists.user.includes(name)&&!confirm(name+' は既に存在します。上書きしますか?'))return;
  }
  say('保存中…');
  try{
    const path=DIR+'/'+name;let sha;
    const g=await gh('user',path);
    if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error('保存前の確認に失敗しました(HTTP '+g.status+')');
    tpl.no=noOf(name)||tpl.no;
    const body={message:'Update preset: '+(tpl.title||name),content:b64e(JSON.stringify(toFile(tpl,noOf(name)),null,2))};
    if(sha)body.sha=sha;
    const r=await fetch(`${API}/repos/${S.repo}/contents/${path}`,{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'HTTP '+r.status)}
    cur={src:'user',name};dirty=false;save();delete cache['user:'+name];
    await listAll();say('保存しました(自分のシート / '+name+')');
  }catch(e){say('保存失敗: '+e.message,true)}
}
async function delSheet(){
  if(!cur||cur.src!='user')return;
  if(!confirm(cur.name+' を削除します。よろしいですか?'))return;
  say('削除中…');
  try{
    const path=DIR+'/'+cur.name,g=await gh('user',path);
    if(!g.ok)throw new Error('HTTP '+g.status);
    const r=await fetch(`${API}/repos/${S.repo}/contents/${path}`,{method:'DELETE',headers:hdr(),body:JSON.stringify({message:'delete '+path,sha:(await g.json()).sha})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    delete cache['user:'+cur.name];cur=null;dirty=true;save();
    await listAll();say('削除しました。いま画面にある内容は未保存の下書きとして残っています');
  }catch(e){say('削除できませんでした('+e.message+')',true)}
}

/* --- プレビュー: 公開ページ(hue_wheel)と同じ作り・同じCSSで描画 --- */
function pubTw(str) {
  let m = 0;
  String(str == null ? '' : str).split('\n').forEach(line => {
    let w = 0; for (let i = 0; i < line.length; i++) w += line.charCodeAt(i) < 256 ? 0.55 : 1;
    if (w > m) m = w;
  });
  return m;
}
// 表の見出し列用: 英数字は太字だと全角より少し狭い程度なので、種類ごとに幅を見積もる(折り返し防止)
function pubTwb(str) {
  let m = 0;
  String(str == null ? '' : str).split('\n').forEach(line => {
    let w = 0;

  const o=(s,a)=>a.map(n=>`<option value="${s}:${esc(n)}">${esc(titleOf(s,n))}</option>`).join('');
  if(!lists.base.length&&!lists.user.length){pk.innerHTML='<span class="cs-missing">選べるシートが見つかりません。通信状況を確認してください。</span><button type="button" class="cs-pcan">閉じる</button>';return}
  pk.innerHTML=`<select class="cs-psel" aria-label="追加するシート">${lists.base.length?`<optgroup label="基本シート">${o('base',lists.base)}</optgroup>`:''}${lists.user.length?`<optgroup label="自分のシート">${o('user',lists.user)}</optgroup>`:''}</select><button type="button" class="cs-padd">追加</button><button type="button" class="cs-pcan">やめる</button>`;
}
window.CSW={
  /* edit=false: キャラ詳細(表示のみ) / edit=true: ✎の編集画面(下書きを持つ) */
  mount(c,edit){
    CW.c=c;CW.ed=!!edit;
    if(edit){
      if(!(CW.draft&&CW.dId===c.id)){
        CW.draft=JSON.parse(JSON.stringify(c.sheets&&Array.isArray(c.sheets.list)?c.sheets.list:[]));CW.dId=c.id;CW.chg=false;
      }
      CW.list=CW.draft;
    }else{
      CW.draft=null;CW.dId=null;CW.chg=false;
      CW.list=(c.sheets&&Array.isArray(c.sheets.list))?c.sheets.list:[];
    }
    if(!(c.id in CW.sel))CW.sel[c.id]=0;
    cwDraw();
  },
  changed:()=>!!(CW.draft&&CW.chg&&CW.c&&CW.dId===CW.c.id&&$('#cswc')),
  /* ✎の保存で呼ぶ: 下書きをキャラのデータへ */
  commit(x){
    if(!CW.draft||CW.dId!==x.id)return;
    cwSync();
    if(CW.chg||(x.sheets&&Array.isArray(x.sheets.list)))x.sheets={list:CW.draft};
    CW.draft=null;CW.dId=null;CW.chg=false;
  }
};
$('#app').addEventListener('input',e=>{
  if(S.tab=='shed'||!CW.ed||!e.target.closest||!e.target.closest('#cswc'))return;
  CW.chg=true;cwSync();
});
$('#app').addEventListener('change',e=>{
  const t=e.target;if(S.tab=='shed'||!t.classList||!t.classList.contains('csw-sel')||!CW.c)return;
  cwSync();CW.sel[CW.c.id]=+t.value||0;cwDraw();
});
$('#app').addEventListener('click',e=>{
  const t=e.target;if(S.tab=='shed'||!t.closest||!CW.ed)return;
  const w=t.closest('#cswc');if(!w||!CW.c)return;
  const c=CW.c,b=t.closest('button');
  if(b&&w.contains(b)){
    const k=b.classList;
    if(k.contains('cs-addsheet')){cwPicker();return}
    if(k.contains('cs-pcan')){w.querySelector('.cs-picker').hidden=true;return}
    if(k.contains('cs-padd')){
      const v=(w.querySelector('.cs-psel')||{}).value||'',n=v.indexOf(':');if(n<1)return;
      cwSync();
      CW.list.push({src:v.slice(0,n),file:v.slice(n+1),v:{}});
      CW.sel[c.id]=CW.list.length-1;CW.chg=true;
      cwDraw();return;
    }
    if(k.contains('cs-del')){
      const i=CW.sel[c.id]||0;if(!CW.list[i])return;
      if(!confirm('このシートをこのキャラから外しますか?(入力した内容も消えます。✎の保存で確定します)'))return;
      CW.list.splice(i,1);CW.sel[c.id]=Math.max(0,i-1);CW.chg=true;
      cwDraw();return;
    }
    if(k.contains('cs-gadd')){
      const box=w.querySelector('.cs-gl[data-si="'+b.dataset.si+'"]');
      if(box&&GP)box.insertAdjacentHTML('beforeend',gpGroup(GP.secs[+b.dataset.si],GP.stack,false));
      CW.chg=true;cwSync();return;
    }
    if(k.contains('cs-gpdel')){const gp=b.closest('.cs-gp');if(gp)gp.remove();CW.chg=true;cwSync();return}
    if(k.contains('cs-tladd')){
      const box=w.querySelector('.cs-tl');
      if(box)box.insertAdjacentHTML('beforeend',tlRow((TL||{}).ex,box.children.length,false));
      CW.chg=true;cwSync();return;
    }
    if(k.contains('cs-evdel')){const ev=b.closest('.cs-ev');if(ev)ev.remove();CW.chg=true;cwSync();return}
    return;
  }
  if(t.tagName==='TD'){const ta=t.querySelector('.cs-tx');if(ta&&!ta.readOnly)ta.focus();return}
  if(t.tagName==='I'&&t.parentNode.classList.contains('cs-b')){
    const bar=t.parentNode,n=Array.prototype.indexOf.call(bar.children,t)+1;
    bar.dataset.v=(bar.dataset.v==n)?'0':String(n);CW.chg=true;cwSync();
  }
});
})();
</script>
</body>
