function demoPrelude(){

  /* ---- 3) サンプルのデータ(作品・キャラ・設定) ---- */
  var T=function(y,m,d){return Date.UTC(y,m-1,d,3)};
  var MIO='# 性格\n普段は口数が少なく、教室の隅から周りの様子を眺めていることが多い。感情を表に出さないせいで冷たい人だと誤解されがちだが、本当は人の変化によく気がつく。慎重で、初めて行く場所では必ず下調べをする。一方で、いったん「やる」と決めたことには驚くほど粘り強い。\n\n'
    +'# 対人関係\n簡単には心を開かず、親しくなるまでには時間がかかる。ただ、いったん身内と決めた相手には、気づかれないようにさりげなく世話を焼く。\n\n'
    +'# 行動原理\n何をするにも最悪の事態を想定し、確信が持てるまで動かない。その代わり、決めたことは最後までやり抜く。\n\n'
    +'# 長所\n・人の話を最後まで聞き、相手を安心させる落ち着きがある\n・決めたことをやり抜く粘り強さがある\n\n'
    +'# 短所\n・心を開くまでに時間がかかり、孤立しやすい\n・慎重さが、行動の遅さにつながることがある\n\n'
    +'# 好みと日常\n## 好きなもの\n雨の日の図書室と、古い文庫本の匂い。温かいミルクティーを両手で持ってページをめくる時間が、いちばん落ち着く。\n\n'
    +'## 趣味・特技\n読書と、傷んだ本の修繕。ページの端を丁寧に直していると、時間を忘れる。\n\n'
    +'## 普段の過ごし方\n朝は誰よりも早く登校し、人のいない図書室で本の整理をする。放課後は書架の間で本を読み、閉館の音楽で顔を上げるのが日課。休日は古本屋を巡るか、家で読書に没頭している。\n\n'
    +'# 背景と内面\n## 大切な人・もの\n祖父からもらった革の栞。どの本を読むときも、必ずこの栞を挟んでいる。\n\n'
    +'## 過去の出来事\n小学生のとき、転校をきっかけに親しい友人と離ればなれになった。それ以来、人との距離の取り方に慎重になり、自分から踏み出すまでに時間がかかるようになった。\n\n'
    +'## 叶えたいこと\nいつか自分の書いた物語を、図書室の棚に並べること。\n\n'
    +'## 隠していること\n本当は物語を書いていて、誰にも見せたことがない。';
  var HARU='# 性格\n誰とでもすぐに打ち解ける、教室のムードメーカー。声が大きく表情もころころ変わるが、誰かが落ち込んでいるときには、さりげなく声のトーンを落とせる繊細さがある。一方で、自分のこととなると急に口が重くなり、冗談でごまかしてしまう。\n\n'
    +'# 対人関係\n誰に対しても距離が近く、初対面でも名前で呼んでしまう。ミオのことは特別に気にかけていて、無理に話しかけず、隣で本を広げて待つようにしている。\n\n'
    +'# 行動原理\n迷ったら、とりあえず動いてみる。失敗しても「次はこうしよう」と切り替えが早く、後悔を長く引きずらない。\n\n'
    +'# 長所\n・場の空気を明るくし、周りが話しやすい雰囲気をつくれる\n・失敗しても立て直しが早く、挑戦をためらわない\n\n'
    +'# 短所\n・弱さを見せるのが苦手で、冗談でごまかしがちである\n・勢いで引き受けすぎて、予定を詰め込みすぎることがある\n\n'
    +'# 好みと日常\n## 好きなもの\n放課後の夕焼けと、購買の焼きそばパン。\n\n'
    +'## 普段の過ごし方\n朝はぎりぎりに滑り込み、昼は購買に走る。放課後は部活の助っ人に呼ばれて校庭を駆け回り、帰りに図書室へ顔を出して、ミオの様子をそっと確かめるのが習慣になっている。\n\n'
    +'# 背景と内面\n## 叶えたいこと\nミオが書いた物語を、いちばん最初の読者として読むこと。\n\n'

  var TSUBAKI='# 性格\n飄々としていて、客が来ても読んでいた本から顔を上げないことが多い。無愛想に見えるが、探している本を言い当てる勘の良さがあり、常連からは妙に慕われている。\n\n'
    +'# 行動原理\n損得よりも、本が行くべき人の手に渡ることを優先する。値段は気分で決まり、ときどき赤字になる。\n\n'
    +'# 長所\n・本と人を結びつける目利きの確かさがある\n・細かいことにこだわらず、おおらかに構えられる\n\n'
    +'# 短所\n・帳簿の管理がずさんで、店の経営は常に危うい\n・面倒な話題になると、すぐ奥に引っ込んでしまう\n\n'
    +'# 背景と内面\n## 大切な人・もの\n先代の店主から受け継いだ、背表紙の剥げた辞書。\n\n'
    +'## 隠していること\n本当は、店に置いている本の半分以上を、まだ読んだことがない。';
  var NAGI='# 性格\n海風のようにおおらかで、細かいことは気にしない。思い立ったらすぐ港へ走っていく行動派だが、潮の満ち引きだけは毎日きちんと確かめる几帳面さがある。\n\n'
    +'# 長所\n・どんな天気でも前向きに動ける明るさがある\n・町の人の顔と名前を、ほとんど覚えている\n\n'
    +'# 短所\n・夢中になると、時間の感覚がなくなる\n・頼まれると断れず、いつも忙しい\n\n'

  var works=[
    {id:'wdemo1',title:'雨宿りの図書室',color:'#8fb8de',o:0,ts:T(2026,9,20),

     notes:[
       {id:'nd1',t:'f',title:'世界観',o:0,ts:T(2026,9,21)},
       {id:'nd2',p:'nd1',title:'雨宿りの図書室',o:0,ts:T(2026,9,21),body:'# 概要\n旧校舎の一階にある、閉架書庫を改装した小さな図書室。蔵書は約三千冊で、古い文庫本が多い。\n\n# ルール\n・雨の日の放課後だけ、一般開放される\n・本の貸出は一人二冊まで\n・閉館は、校内放送の短いチャイムが鳴ったとき\n\n# 雰囲気\n窓際の席は雨音がよく聞こえ、ミオのお気に入りになっている。'},
       {id:'nd3',p:'nd1',title:'古書店「ことのは堂」',o:1,ts:T(2026,9,22),body:'# 概要\n商店街の端にある、間口の狭い古書店。店主は椿。\n\n# 品ぞろえ\n文庫本と古い児童書が中心。値札はなく、値段は店主の気分で決まる。\n\n# 常連\nミオは休日になると、開店と同時に通っている。'},

     ],
     memos:[{id:'md1',cat:'kd1',title:'ミオの口調メモ',o:0,ts:T(2026,9,24),body:'# 話し方\n・語尾は短く、「……うん」「そう」など相づちが多い\n・親しい相手には、ときどき柔らかい敬語が混ざる\n\n# 例\n「……雨、止まないね」\n「本の端、折れてる。直してもいい?」'}]},

  /* ---- 4) GitHub の代わりになる、メモリ上のファイル置き場 ---- */
  var F={},SEQ=1;
  function typeOf(p){return /\.svg$/i.test(p)?'image/svg+xml':/\.webp$/i.test(p)?'image/webp':/\.png$/i.test(p)?'image/png':/\.jpe?g$/i.test(p)?'image/jpeg':/\.json$/i.test(p)?'application/json':'application/octet-stream'}

  function J(o,st){return new Response(JSON.stringify(o),{status:st||200,headers:{'Content-Type':'application/json'}})}
  function b64enc(t){var u=new TextEncoder().encode(t),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function b64blob(b,type){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:type})}

  var _fetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    init=init||{};
    var url=typeof input==='string'?input:(input&&input.url)||String(input);
    if(/^(blob|data):/i.test(url))return _fetch(input,init);
    var u;try{u=new URL(url,location.href)}catch(e){return _fetch(input,init)}
    if(u.host===location.host)return _fetch(input,init);
    var p=u.pathname,hd=init.headers||{},accept=String(hd.Accept||hd.accept||'');
    if(p==='/me')return Promise.resolve(J({username:'demo',repo:REPO}));
    if(p==='/login'||p==='/register'||p==='/ai')return Promise.resolve(J({error:'demo'},403));
    var m=/^\/gh\/repos\/([^/]+)\/([^/]+)\/contents\/(.*)$/.exec(p);
    if(!m)return _fetch(input,init);
    var repo=decodeURIComponent(m[1])+'/'+decodeURIComponent(m[2]),path=decodeURIComponent(m[3]);
    if(repo!==REPO)return Promise.resolve(J({message:'Not Found'},404));
    var meth=String(init.method||'GET').toUpperCase(),f=F[path];
    if(meth==='GET'){
      if(!f)return Promise.resolve(J({message:'Not Found'},404));
      if(/raw/i.test(accept))return Promise.resolve(new Response(f.t!=null?new Blob([f.t],{type:f.type}):b64blob(f.b,f.type),{status:200,headers:{'Content-Type':f.type}}));
      return Promise.resolve(J({type:'file',path:path,sha:f.sha,size:(f.t!=null?f.t.length:f.b.length),encoding:'base64',content:f.t!=null?b64enc(f.t):f.b}));
    }
    if(meth==='PUT'){
      var b={};try{b=JSON.parse(init.body)}catch(e){}
      F[path]={b:b.content||'',type:typeOf(path),sha:'s'+(SEQ++)};
      return Promise.resolve(J({content:{path:path,sha:F[path].sha}},f?200:201));
    }
    if(meth==='DELETE'){delete F[path];return Promise.resolve(J({commit:{}}))}
    return Promise.resolve(J({message:'Method Not Allowed'},405));
  };

  /* ---- 5) デモでは使えない操作を、わかりやすい案内に差し替える(アプリの読み込み後) ---- */
  addEventListener('load',function(){
    window.qzAi=function(){try{qzMsg('デモではAIによる整形は使えません。ログイン後にお試しください',1)}catch(e){}};
    window.logout=function(){try{status('デモでは切断できません')}catch(e){}};
  });
}

(function(){
  var fr=document.getElementById('fr');
  document.getElementById('rs').addEventListener('click',function(){
    try{Object.keys(localStorage).filter(function(k){return k.indexOf('demo:')===0}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}
    location.reload();
  });
  function fail(msg){
    fr.hidden=true;
    var d=document.createElement('div');d.className='err';
    d.innerHTML='<h2>デモを開けませんでした</h2><p>'+msg+'</p><p><a href="index.html">アプリのページへ</a></p>';
    document.body.appendChild(d);
  }
  fetch('index.html',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('http');
    return r.text();
  }).then(function(html){
    var inj='<script>('+demoPrelude.toString()+')();<\/script>';
    html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+inj}):inj+html;
    fr.srcdoc=html;
  }).catch(function(){
    fail('index.html を読み込めませんでした。このページは index.html と同じ場所に置いて、https(GitHub Pages など)から開いてください。');
  });
})();
